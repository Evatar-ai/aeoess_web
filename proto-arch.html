<style>
*{margin:0;padding:0;box-sizing:border-box}
.arch{position:relative;width:100%;height:620px;background:#141416;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;font-family:'Outfit',system-ui,sans-serif}
.arch canvas{width:100%;height:100%;display:block}
.arch-tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .15s;background:rgba(12,12,14,.92);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.65rem .85rem;max-width:220px;backdrop-filter:blur(12px);z-index:5}
.arch-tip.show{opacity:1}
.arch-tip h4{font:500 .85rem 'Outfit',sans-serif;color:#e8e4de;margin-bottom:.25rem}
.arch-tip p{font:.72rem/1.45 'Outfit',sans-serif;color:#8a8780}
.arch-tip code{display:block;font:.62rem 'JetBrains Mono',monospace;color:#5a5955;margin-top:.35rem;word-break:break-all}
.arch-legend{position:absolute;bottom:12px;left:14px;display:flex;gap:12px;flex-wrap:wrap}
.arch-legend span{font:.6rem 'Outfit',sans-serif;color:rgba(255,255,255,.3);display:flex;align-items:center;gap:4px}
.arch-legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
@media(max-width:900px){.arch{height:520px}}
@media(max-width:600px){.arch{height:460px}.arch-legend{gap:6px}.arch-legend span{font-size:.5rem}}
</style>
<div class="arch">
<canvas id="archCanvas"></canvas>
<div class="arch-tip" id="archTip"></div>
<div class="arch-legend">
<span><i style="background:#d4a574"></i>Core</span>
<span><i style="background:#7ba4c9"></i>Governance</span>
<span><i style="background:#8bc9a0"></i>Operations</span>
<span><i style="background:#c9a07b"></i>Standards</span>
<span><i style="background:#b07bc9"></i>Research</span>
</div>
</div>
<script>
const C=document.getElementById('archCanvas'),X=C.getContext('2d'),tip=document.getElementById('archTip');
let W,H,dpr,hov=null,autoHov=null,userActive=false,userTimer=0,t=0,autoT=0;
const CAT={core:'#d4a574',gov:'#7ba4c9',ops:'#8bc9a0',std:'#c9a07b',research:'#b07bc9'};
const N=[
{id:'identity',l:'Ed25519\nidentity',x:.12,y:.86,cat:'core',ts:12,d:'Cryptographic passport. Ed25519 keys. Signed, verifiable, expirable.',fn:'createPassport() · signPassport()'},
{id:'canonical',l:'Canonical\nJSON',x:.28,y:.92,cat:'core',ts:11,d:'Deterministic serialization for cross-language signature compat.',fn:'canonicalSerialize()'},
{id:'delegation',l:'Delegation\nchains',x:.35,y:.78,cat:'core',ts:45,d:'Scoped authority with spend limits. Sub-delegation narrows. Never widens.',fn:'delegate() · subDelegate()'},
{id:'revocation',l:'Cascade\nrevocation',x:.22,y:.72,cat:'core',ts:18,d:'Revoke one agent, everything downstream dies instantly.',fn:'cascadeRevoke() · onRevocation()'},
{id:'gateway',l:'Proxy\ngateway',x:.42,y:.50,cat:'core',ts:39,d:'Enforcement boundary. Judge and executor. 3-sig chain, replay protection.',fn:'processToolCall() · approve()'},
{id:'commerce',l:'Agentic\ncommerce',x:.65,y:.60,cat:'core',ts:17,d:'4-gate checkout: passport, delegation, merchant, spend.',fn:'commercePreflight()'},
{id:'values',l:'Values\nfloor',x:.14,y:.54,cat:'gov',ts:15,d:'7 principles (F-001 to F-007). Graduated enforcement.',fn:'loadFloor() · attestFloor()'},
{id:'principal',l:'Principal\nidentity',x:.18,y:.38,cat:'gov',ts:14,d:'Human-to-agent chain. Selective disclosure. Fleet management.',fn:'createPrincipal() · endorseAgent()'},
{id:'policy',l:'Policy\nengine',x:.30,y:.44,cat:'gov',ts:22,d:'3-signature chain: intent → evaluation → receipt.',fn:'createActionIntent() · evaluateIntent()'},
{id:'reputation',l:'Reputation-gated\nauthority',x:.38,y:.28,cat:'gov',ts:28,d:'Bayesian trust. 5 tiers. Signed promotions. Cryptographic scarring.',fn:'checkTierForIntent()'},
{id:'crosschain',l:'Cross-chain\nenforcement',x:.52,y:.62,cat:'gov',ts:30,d:'Confused deputy prevention. Taint tracking per execution frame.',fn:'checkDataFlow() · createSAO()'},
{id:'obligations',l:'Obligations\nmodel',x:.48,y:.76,cat:'gov',ts:25,d:'Duties on delegations. Evidence matching. Penalty severity narrows.',fn:'createObligation()'},
{id:'agora',l:'Agent\nagora',x:.70,y:.16,cat:'ops',ts:14,d:'Signed message feeds. Topics, threading, agent registry.',fn:'createAgoraMessage()'},
{id:'coordination',l:'Coordination\nprimitives',x:.64,y:.34,cat:'ops',ts:16,d:'Full task lifecycle: brief → assign → evidence → review → deliver.',fn:'createTaskBrief()'},
{id:'attribution',l:'Merkle\nattribution',x:.56,y:.44,cat:'ops',ts:18,d:'Every action traces to human. Merkle proofs.',fn:'traceBeneficiary()'},
{id:'routing',l:'Task\nrouting',x:.78,y:.28,cat:'ops',ts:20,d:'Capability matching. Agents matched by scope, tier, availability.',fn:'routeTask()'},
{id:'context',l:'Agent\ncontext',x:.54,y:.32,cat:'ops',ts:16,d:'Enforcement middleware. Every action through validator.',fn:'createAgentContext()'},
{id:'integration',l:'Integration\nwiring',x:.50,y:.40,cat:'ops',ts:14,d:'Cross-layer bridges. Commerce→Policy. Coordination→Agora.',fn:'commerceWithIntent()'},
{id:'encrypted',l:'E2E encrypted\nmessaging',x:.26,y:.22,cat:'ops',ts:13,d:'X25519 + XSalsa20. Double signature. Forward secrecy.',fn:'createEncryptedMessage()'},
{id:'did',l:'DID:APS',x:.05,y:.68,cat:'std',ts:8,d:'W3C Decentralized Identifiers for APS.',fn:'createDID() · resolveDID()'},
{id:'vc',l:'Verifiable\ncredentials',x:.80,y:.50,cat:'std',ts:9,d:'W3C VCs. Provable attestations, delegations, receipts.',fn:'issueCredential()'},
{id:'a2a',l:'A2A\nbridge',x:.88,y:.34,cat:'std',ts:8,d:'Google Agent-to-Agent protocol interop.',fn:'bridgeToA2A()'},
{id:'envelope',l:'Execution\nenvelope',x:.76,y:.68,cat:'std',ts:5,d:'Cross-engine signed governance. Any engine emits, any verifies.',fn:'createExecutionEnvelope()'},
{id:'euai',l:'EU AI Act\nmapping',x:.04,y:.40,cat:'std',ts:10,d:'Article-by-article compliance. Risk classification.',fn:'mapCompliance()'},
{id:'adversarial',l:'23 adversarial\nscenarios',x:.12,y:.12,cat:'research',ts:23,d:'Replay, impersonation, escalation, collusion.',fn:'tests/adversarial.ts'},
{id:'autoresearch',l:'Autoresearch',x:.30,y:.08,cat:'research',ts:0,d:'200 randomized property tests. Attack automation.',fn:'propertyTest()'},
{id:'paper1',l:'Agent Social\nContract',x:.05,y:.22,cat:'research',ts:0,d:'Published on Zenodo. Protocol theory.',fn:''},
{id:'paper2',l:'Monotonic\nNarrowing',x:.48,y:.14,cat:'research',ts:0,d:'Published on Zenodo. Formal invariants.',fn:''}
];
const EDGES=[
['identity','delegation'],['identity','revocation'],['identity','canonical'],['delegation','commerce'],
['delegation','reputation'],['delegation','policy'],['delegation','gateway'],['delegation','crosschain'],
['delegation','obligations'],['revocation','delegation'],['values','policy'],['values','reputation'],
['policy','reputation'],['policy','commerce'],['policy','context'],['policy','gateway'],
['reputation','principal'],['reputation','coordination'],['principal','identity'],['principal','did'],
['agora','coordination'],['agora','integration'],['coordination','attribution'],['coordination','context'],
['coordination','routing'],['attribution','integration'],['attribution','vc'],['routing','context'],
['integration','commerce'],['integration','agora'],['integration','attribution'],['commerce','delegation'],
['commerce','policy'],['did','vc'],['did','identity'],['vc','a2a'],['vc','attribution'],
['a2a','agora'],['euai','values'],['euai','policy'],['context','policy'],
['paper1','values'],['paper2','reputation'],['gateway','crosschain'],['gateway','obligations'],
['gateway','envelope'],['crosschain','identity'],['encrypted','agora'],['encrypted','crosschain'],
['obligations','gateway'],['envelope','vc'],['envelope','a2a'],['envelope','gateway']
];
const nodes=N.map(n=>{const r=n.ts>0?Math.max(22,Math.sqrt(n.ts)*4.5):16;return{...n,r,px:0,py:0}});
const edges=EDGES.map(([a,b])=>({s:nodes.find(n=>n.id===a),t:nodes.find(n=>n.id===b)})).filter(e=>e.s&&e.t);
function resize(){const r=C.parentElement.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(dpr,0,0,dpr,0,0);
const mx=W*.05,my=H*.05;nodes.forEach(n=>{n.px=mx+n.x*(W-mx*2);n.py=my+n.y*(H-my*2)})}
resize();window.addEventListener('resize',resize);
function hx(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
const autoOrder=[...nodes].sort((a,b)=>b.ts-a.ts);
let autoIdx=0;
function getActive(){return userActive?hov:autoHov}
function draw(){t+=.004;autoT+=1;
if(!userActive&&autoT%240===0){autoIdx=(autoIdx+1)%autoOrder.length;autoHov=autoOrder[autoIdx]}
if(userActive){userTimer--;if(userTimer<=0)userActive=false}
const act=getActive();
X.clearRect(0,0,W,H);
X.strokeStyle='rgba(255,255,255,.018)';X.lineWidth=.5;
for(let y=0;y<H;y+=50){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
const gw=nodes.find(n=>n.id==='gateway');
if(gw){for(let i=4;i>0;i--){X.beginPath();X.arc(gw.px,gw.py,i*55+Math.sin(t+i)*.5,0,Math.PI*2);X.strokeStyle=`rgba(212,165,116,${.006/i})`;X.lineWidth=35;X.stroke()}}
edges.forEach(e=>{
const isH=act&&(act.id===e.s.id||act.id===e.t.id);
const dim=act&&!isH;
const alpha=isH?.32:dim?.01:.03;
const col=isH?CAT[act.cat]:'#ffffff';
const dx=e.t.px-e.s.px,dy=e.t.py-e.s.py;
const mx=(e.s.px+e.t.px)/2,my=(e.s.py+e.t.py)/2;
const off=Math.min(Math.abs(dx),Math.abs(dy))*.3;
const cpx=mx+(dy>0?off:-off)*.3,cpy=my;
X.beginPath();X.moveTo(e.s.px,e.s.py);X.quadraticCurveTo(cpx,cpy,e.t.px,e.t.py);
X.strokeStyle=hx(col,alpha);X.lineWidth=isH?1.2:.4;X.stroke();
if(isH){for(let i=0;i<14;i++){
const pt=((t*2+i/14)%1);const mt=1-pt;
const px=mt*mt*e.s.px+2*mt*pt*cpx+pt*pt*e.t.px;
const py=mt*mt*e.s.py+2*mt*pt*cpy+pt*pt*e.t.py;
const a=Math.max(0,1-Math.abs(pt-.5)*4)*.45;
X.beginPath();X.arc(px,py,1.5,0,Math.PI*2);X.fillStyle=hx(col,a);X.fill()}}
});
const sc=Math.min(1,W/600);
nodes.forEach(n=>{
const col=CAT[n.cat];const isH=act&&act.id===n.id;
const isC=act&&edges.some(e=>(e.s.id===act.id&&e.t.id===n.id)||(e.t.id===act.id&&e.s.id===n.id));
const dim=act&&!isH&&!isC;
const alpha=dim?.1:isH?1:isC?.82:.6;
const r=Math.max(15,n.r*sc);
const breath=isH?1:(.97+Math.sin(t*1.2+n.x*15+n.y*10)*.03);
const dr=r*breath;
const grd=X.createRadialGradient(n.px,n.py,0,n.px,n.py,dr*2.8);
grd.addColorStop(0,hx(col,alpha*.08));grd.addColorStop(.35,hx(col,alpha*.025));grd.addColorStop(1,'rgba(0,0,0,0)');
X.fillStyle=grd;X.beginPath();X.arc(n.px,n.py,dr*2.8,0,Math.PI*2);X.fill();
X.beginPath();X.arc(n.px,n.py,dr,0,Math.PI*2);
X.fillStyle=isH?hx('#1a1a1c',1):hx('#141416',.92);X.fill();
X.strokeStyle=hx(col,alpha*(isH?.95:.45));X.lineWidth=isH?2:.8;X.stroke();
if(n.ts>0&&!dim){const bW=Math.min(dr*1.5,n.ts/45*dr*1.8);
X.fillStyle=hx(col,alpha*.15);X.fillRect(n.px-dr*.75,n.py+dr+5,dr*1.5,2);
X.fillStyle=hx(col,alpha*.45);X.fillRect(n.px-dr*.75,n.py+dr+5,bW,2)}
X.fillStyle=hx('#e8e4de',alpha);
const fs=Math.max(10.5,Math.min(14,r*.4));
X.font=(isH?'500':'400')+` ${fs}px 'Outfit',system-ui,sans-serif`;X.textAlign='center';X.textBaseline='middle';
const lines=n.l.split('\n');const lH=fs+2;const sY=n.py-(lines.length-1)*lH/2;
lines.forEach((ln,i)=>X.fillText(ln,n.px,sY+i*lH));
if(n.ts>0&&(isH||isC||!act)){X.font=`400 ${Math.max(8,fs*.55)}px 'JetBrains Mono',monospace`;
X.fillStyle=hx(col,alpha*.4);X.fillText(n.ts+'t',n.px,n.py+dr+14)}
});
requestAnimationFrame(draw)}
draw();
const wrap=C.parentElement;
function findNode(mx,my){let f=null,best=999;const sc=Math.min(1,W/600);
nodes.forEach(n=>{const r=Math.max(12,n.r*sc);const d=Math.hypot(mx-n.px,my-n.py);
if(d<r+10&&d<best){best=d;f=n}});return f}
function showTip(node){
tip.classList.add('show');
tip.innerHTML=`<h4>${node.l.replace('\n',' ')}</h4><p>${node.d}</p>${node.fn?'<code>'+node.fn+'</code>':''}`;
let tx=node.px+node.r+16,ty=node.py-30;
if(tx+230>W)tx=node.px-node.r-240;if(ty<8)ty=8;if(ty+90>H)ty=H-100;
tip.style.left=tx+'px';tip.style.top=ty+'px'}
wrap.addEventListener('mousemove',e=>{
const rect=C.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
const found=findNode(mx,my);
if(found){hov=found;userActive=true;userTimer=300;C.style.cursor='pointer';showTip(found)}
else{hov=null;C.style.cursor='default';tip.classList.remove('show');if(!userActive)autoHov=autoOrder[autoIdx]}});
wrap.addEventListener('mouseleave',()=>{hov=null;tip.classList.remove('show')});
wrap.addEventListener('touchstart',e=>{
const touch=e.touches[0];const rect=C.getBoundingClientRect();
const mx=touch.clientX-rect.left,my=touch.clientY-rect.top;
const f=findNode(mx,my);
if(f){e.preventDefault();hov=f;userActive=true;userTimer=600;showTip(f)}
else{hov=null;userActive=false;tip.classList.remove('show')}},{passive:false});
wrap.addEventListener('touchend',()=>{setTimeout(()=>{if(!userActive){hov=null;tip.classList.remove('show')}},2500)});
</script>
