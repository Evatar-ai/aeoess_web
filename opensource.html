/* inlined from aeoess-responsive.css */
/* aeoess-responsive.css
   Global mobile rules. Targets the inline-styled grids and flex layouts
   used throughout aeoess-* page components. Activates at <=768px.

   Strategy: !important overrides to beat React's inline styles.
   Scoped under [data-aeoess-page] so this only affects our pages,
   not the design canvas chrome.
*/

/* ─────────────────────────────────────────────────────────────────
   Mark every aeoess page root with [data-aeoess-page]
   so we can scope without collateral damage.
   We auto-tag: any element with class .aeoess-page, OR
   the responsive rules below use a media query + a generic selector.
   ───────────────────────────────────────────────────────────────── */

/* Hide hamburger by default; the SubHeader renders both */
.aeoess-hamburger { display: none !important; }
.aeoess-mobile-menu { display: none; }

@media (max-width: 768px) {

  /* ── 1. SubHeader: hide desktop nav, show hamburger ─────────── */
  .aeoess-nav-desktop {
    display: none !important;
  }
  .aeoess-hamburger {
    display: inline-flex !important;
  }
  .aeoess-mobile-menu.open {
    display: flex !important;
  }

  /* ── 2. Reduce horizontal padding everywhere ────────────────── */
  /* Pages use padding: '72px 40px' or similar. Force inner padding down. */
  [data-aeoess-page] section,
  [data-aeoess-page] header,
  [data-aeoess-page] footer {
    padding-left: 20px !important;
    padding-right: 20px !important;
  }

  /* ── 3. Force every multi-column grid to single column ──────── */
  /* Catches the dominant "1fr 1fr", "1fr 1fr 1fr", "1.3fr 1fr",
     "200px 1fr", "90px 90px 1fr 80px" etc. patterns we use */
  [data-aeoess-page] [style*="grid-template-columns"],
  [data-aeoess-page] [style*="gridTemplateColumns"] {
    grid-template-columns: 1fr !important;
  }

  /* ── 4. Force flex rows with explicit gaps to wrap ──────────── */
  [data-aeoess-page] [style*="display: flex"][style*="gap"],
  [data-aeoess-page] [style*="display:flex"][style*="gap"] {
    flex-wrap: wrap !important;
  }

  /* ── 5. Reduce hero typography ──────────────────────────────── */
  [data-aeoess-page] h1 {
    font-size: clamp(32px, 9vw, 44px) !important;
    line-height: 1.1 !important;
  }
  [data-aeoess-page] h2 {
    font-size: clamp(24px, 6.5vw, 32px) !important;
    line-height: 1.15 !important;
  }

  /* ── 6. Tables: allow horizontal scroll ─────────────────────── */
  [data-aeoess-page] table {
    display: block !important;
    overflow-x: auto !important;
    white-space: nowrap !important;
    max-width: 100% !important;
  }

  /* ── 7. Code blocks scroll horizontally instead of overflowing  */
  [data-aeoess-page] pre {
    overflow-x: auto !important;
    font-size: 11.5px !important;
  }

  /* ── 8. Sticky aside (Updates rail) becomes inline ──────────── */
  [data-aeoess-page] aside[style*="sticky"] {
    position: static !important;
    max-height: none !important;
    margin-top: 32px !important;
  }

  /* ── 9. Footer columns stack ────────────────────────────────── */
  [data-aeoess-page] footer [style*="grid"] {
    grid-template-columns: 1fr !important;
    gap: 20px !important;
  }

  /* ── 10. Reduce padding on inner panels ─────────────────────── */
  [data-aeoess-page] [style*="padding: 28px 32px"],
  [data-aeoess-page] [style*="padding:28px 32px"],
  [data-aeoess-page] [style*="padding: 24px 28px"] {
    padding: 18px 16px !important;
  }

  /* ── 11. Update entry rail (a in updates list) ──────────────── */
  [data-aeoess-page] aside [style*="display: grid"] {
    grid-template-columns: 1fr !important;
  }

  /* ── 12. Buttons stay readable ──────────────────────────────── */
  [data-aeoess-page] a[style*="padding: 10px 16px"],
  [data-aeoess-page] button {
    min-height: 40px;
  }
}

/* iOS-frame artboards have a smaller viewport; let the same media
   query catch them too. iOS frame inner width is 375px so it triggers. */

  <script type="text/babel">
/* inlined from src/aeoess-tokens.jsx */
// aeoess-tokens.jsx
// Shared design tokens + base UI for the three landing-page directions.
// Tokens are exact mirrors of shared.css per brief.

const AEOESS_LIGHT = {
  bg:'#ffffff', paper:'#fafaf8', surface:'#f4f4f2', surface2:'#eeeeed',
  ink:'#0a0a0a', ink2:'#1a1a1a', ink3:'#333333', ink4:'#555555', ink5:'#888888',
  rule:'#bbbbbb', ruleLight:'#dddddd',
  link:'#1a4fa0', linkHover:'#0d3a7a',
  codeBg:'#f3f3f1',
  green:'#166534', blue:'#1e40af', red:'#b91c1c',
};
const AEOESS_DARK = {
  bg:'#1c1c1e', paper:'#242426', surface:'#2a2a2e', surface2:'#323236',
  ink:'#ececec', ink2:'#dddddd', ink3:'#b0b0b0', ink4:'#8a8a8e', ink5:'#5a5a5e',
  rule:'#3a3a3e', ruleLight:'#2e2e32',
  link:'#7cacde', linkHover:'#a0c8f0',
  codeBg:'#28282c',
  green:'#4ade80', blue:'#60a5fa', red:'#f87171',
};

// Returns the active palette + the chosen accent color resolved against the palette.
function aeoessPalette({ dark, accent }) {
  const p = dark ? AEOESS_DARK : AEOESS_LIGHT;
  let accentColor = p.green;
  if (accent === 'ink') accentColor = p.ink;
  else if (accent === 'blue') accentColor = p.blue;
  return { ...p, accentColor };
}

// Heads up: the four buyer-category copy decks.
// Refined from the brief; kept tight enough to fit a card without truncation.
const SOLUTIONS = [
  {
    id:'payments', title:'Payments',
    tag:'For fintech, marketplaces, B2B commerce',
    pitch:'Let agents spend money under cryptographic limits.',
    body:'Six rails, a four-gate spending policy, signed payment receipts. Every transaction carries the delegation that authorized it.',
  },
  {
    id:'content', title:'Content',
    tag:'For publishers, data providers, IP owners',
    pitch:'License your content to AI without losing control.',
    body:'Governance blocks, signed access receipts, and revocation that propagates through derivatives. Your terms travel with the bytes.',
  },
  {
    id:'compliance', title:'Compliance',
    tag:'For regulated industries and EU operators',
    pitch:'Prove every agent action under your regulator.',
    body:'Eight governance primitives mapped to EU AI Act, NIST AI RMF, ISO 42001, and SR 11-7. Auditors verify receipts without going through us.',
  },
  {
    id:'enterprise', title:'Enterprise',
    tag:'For internal agent fleets and platform teams',
    pitch:'Run internal agent fleets with full audit.',
    body:'Bring your own identity formats: did:key, did:web, SPIFFE, OAuth. Policy enforcement at action time, signed audit trail by default.',
  },
];

// Minimal line icons rendered to currentColor, flat fill style matches
// the icon option Tima picked (filled square with cutout dot).
function SolutionIcon({ id, size = 22 }) {
  const s = size;
  const stroke = { stroke:'currentColor', strokeWidth:1.4, fill:'none', strokeLinecap:'round', strokeLinejoin:'round' };
  switch (id) {
    case 'payments':
      return (
        <svg width={s} height={s} viewBox="0 0 24 24" {...stroke}>
          <rect x="3" y="6" width="18" height="13" rx="2"/>
          <path d="M3 10h18"/>
          <path d="M7 15h3"/>
        </svg>
      );
    case 'content':
      return (
        <svg width={s} height={s} viewBox="0 0 24 24" {...stroke}>
          <path d="M6 3h9l4 4v14H6z"/>
          <path d="M15 3v4h4"/>
          <path d="M9 12h7M9 16h5"/>
        </svg>
      );
    case 'compliance':
      return (
        <svg width={s} height={s} viewBox="0 0 24 24" {...stroke}>
          <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      );
    case 'enterprise':
      return (
        <svg width={s} height={s} viewBox="0 0 24 24" {...stroke}>
          <rect x="3" y="9" width="7" height="11" rx="1"/>
          <rect x="14" y="4" width="7" height="16" rx="1"/>
          <path d="M5.5 13h2M5.5 16h2M16.5 8h2M16.5 11h2M16.5 14h2"/>
        </svg>
      );
    default: return null;
  }
}

// Aeoess-style logomark, flat ink, paired with wordmark in directions where
// the layout allows it. The actual site uses an "AEOESS" wordmark in caps;
// we reproduce that, with the leading O slightly offset as a visual nod to
// the architecture viz nodes.
function AeoessMark({ size = 22, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="6" cy="12" r="4" fill={color || 'currentColor'}/>
      <circle cx="14" cy="12" r="4" fill="none" stroke={color || 'currentColor'} strokeWidth="1.4"/>
      <circle cx="14" cy="12" r="1.4" fill={color || 'currentColor'}/>
    </svg>
  );
}

// Architecture-viz mock. A subtle, animated representation of the protocol:
// principal -> delegation -> agent -> action receipts. Hovering a node
// highlights the path. Designed to read as "this would be a live iframe".
function ArchitectureMock({ palette, height = 380 }) {
  const [hover, setHover] = React.useState('agent');
  const P = palette;
  const nodeFill = P.paper;
  const nodeStroke = P.rule;
  const dim = (id) => hover && hover !== id;

  // Five nodes laid out left-to-right with two parallel signing paths.
  const nodes = [
    { id:'principal', x:90,  y:190, label:'Principal',   sub:'human / org' },
    { id:'passport',  x:280, y:120, label:'Passport',    sub:'identity' },
    { id:'delegation',x:280, y:260, label:'Delegation',  sub:'scope · spend · sunset' },
    { id:'agent',     x:500, y:190, label:'Agent',       sub:'acts on your behalf' },
    { id:'gateway',   x:720, y:120, label:'Gateway',     sub:'policy enforcement' },
    { id:'receipt',   x:720, y:260, label:'Receipt',     sub:'signed audit' },
  ];
  const edges = [
    ['principal','passport'],
    ['principal','delegation'],
    ['passport','agent'],
    ['delegation','agent'],
    ['agent','gateway'],
    ['agent','receipt'],
  ];
  const idx = Object.fromEntries(nodes.map(n => [n.id, n]));

  return (
    <div style={{ position:'relative', width:'100%', height, background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:6, overflow:'hidden' }}>
      {/* faint grid for "live system" texture */}
      <div style={{ position:'absolute', inset:0,
        backgroundImage:`linear-gradient(${P.ruleLight} 1px, transparent 1px), linear-gradient(90deg, ${P.ruleLight} 1px, transparent 1px)`,
        backgroundSize:'40px 40px', opacity:.35, maskImage:'radial-gradient(ellipse at center, #000 30%, transparent 80%)' }}/>
      <svg viewBox="0 0 820 380" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" style={{ position:'relative' }}>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill={P.ink4}/>
          </marker>
          <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill={P.accentColor}/>
          </marker>
        </defs>

        {edges.map(([a,b]) => {
          const A = idx[a], B = idx[b];
          const active = !hover || hover === a || hover === b;
          return (
            <g key={a+'-'+b} opacity={active ? 1 : .25}>
              <line x1={A.x+58} y1={A.y} x2={B.x-58} y2={B.y}
                stroke={active && hover ? P.accentColor : P.ink4}
                strokeWidth={active && hover ? 1.6 : 1}
                strokeDasharray="4 4"
                markerEnd={active && hover ? 'url(#arrowAccent)' : 'url(#arrow)'}>
                <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
              </line>
            </g>
          );
        })}

        {nodes.map(n => {
          const active = hover === n.id;
          const dimmed = dim(n.id);
          return (
            <g key={n.id}
               onMouseEnter={() => setHover(n.id)}
               onMouseLeave={() => setHover('agent')}
               style={{ cursor:'default' }}
               opacity={dimmed ? .5 : 1}>
              <rect x={n.x-58} y={n.y-30} width="116" height="60" rx="4"
                fill={nodeFill}
                stroke={active ? P.accentColor : nodeStroke}
                strokeWidth={active ? 1.5 : 1}/>
              <text x={n.x} y={n.y-4} textAnchor="middle" fontSize="13" fontWeight="600" fill={P.ink}>
                {n.label}
              </text>
              <text x={n.x} y={n.y+14} textAnchor="middle" fontSize="10.5" fill={P.ink4}>
                {n.sub}
              </text>
            </g>
          );
        })}

        {/* corner labels for the two signing paths */}
        <text x={400} y={70} textAnchor="middle" fontSize="10.5" fill={P.ink5} letterSpacing="0.08em">IDENTITY PATH</text>
        <text x={400} y={335} textAnchor="middle" fontSize="10.5" fill={P.ink5} letterSpacing="0.08em">DELEGATION PATH</text>
      </svg>
    </div>
  );
}

// Pull quote + proof points used in the "Recognized by" section. Real items
// per brief; placeholders are clearly marked so Tima can swap.
const PROOF = [
  { kind:'cite', label:'Cited in', body:'University of British Columbia paper on Personal Data Repositories' },
  { kind:'cite', label:'Integration', body:'Microsoft Agent Toolkit, PR in review' },
  { kind:'cite', label:'Federal', body:'NIST NCCoE concept paper submitted' },
  { kind:'cite', label:'Ecosystem', body:'Active integrations with peer protocols' },
];

Object.assign(window, {
  AEOESS_LIGHT, AEOESS_DARK, aeoessPalette,
  SOLUTIONS, SolutionIcon, AeoessMark, ArchitectureMock, PROOF,
});

</script>
  <script type="text/babel">
/* inlined from src/aeoess-restrained.jsx */

// ── Responsive header for the Restrained landing ─────────────────
function RestrainedHeader({ palette: P, pad }) {

  return (
    <header style={{ borderBottom: `1px solid ${P.ruleLight}`, background: P.paper, position: 'sticky', top: 0, zIndex: 5 }}>

          <a href="/pricing.html" style={{

          }}>Get Started <span style={{ opacity: .7 }}>→</span></a>
        </div>
        <button
          className="aeoess-hamburger"
          aria-label="Menu"
          onClick={() => setOpen(o => !o)}
          style={{
            marginLeft:'auto', display:'none',
            alignItems:'center', justifyContent:'center',
            width:40, height:40, padding:0,
            background:'transparent', border:`1px solid ${P.ruleLight}`,
            borderRadius:4, cursor:'pointer', color:P.ink,
          }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            {open ? (

            )}
          </svg>
        </button>
      </div>
      <div
        className={`aeoess-mobile-menu${open ? ' open' : ''}`}
        style={{
          display:'none', flexDirection:'column',
          borderTop:`1px solid ${P.ruleLight}`, background:P.paper,
          padding:`8px ${pad}px 16px`,
        }}>
        {['Solutions','Open Source','Pricing','Spec','Docs','Resources','Contact'].map((l, i, arr) => (
          <a key={l} href="#" onClick={() => setOpen(false)}
             style={{
               padding:'14px 0', borderBottom: i < arr.length-1 ? `1px solid ${P.ruleLight}` : 'none',
               color:P.ink, textDecoration:'none', fontSize:15, fontWeight:500,
             }}>{l}</a>
        ))}
        <a href="/pricing.html" onClick={() => setOpen(false)}
           style={{
             marginTop:14, display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6,
             padding:'12px 16px',
             background:P.accentColor, color: P.accentColor === P.ink ? P.paper : '#fff',
             fontSize:14, fontWeight:500, borderRadius:4, textDecoration:'none',
           }}>Get Started <span style={{ opacity:.7 }}>→</span></a>
      </div>
    </header>

}

function AeoessRestrained({ palette, density, pillarCount, showProof, heroFont, showUpdates = true }) {
  const P = palette;
  const pad = density === 'compact' ? 28 : density === 'comfy' ? 56 : 40;
  const sectionPadY = density === 'compact' ? 80 : density === 'comfy' ? 140 : 110;

  const fontFamily = heroFont === 'inter' ?
  '"Inter", -apple-system, system-ui, sans-serif' :
  heroFont === 'plex' ?
  '"IBM Plex Sans", -apple-system, system-ui, sans-serif' :
  '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';

  const pillars = [
  { h: 'Identity that travels.', b: 'Agents carry verifiable identity across systems. Use existing formats, did:web, OAuth, SPIFFE, or our native passport. No vendor lock-in.' },
  { h: 'Policy enforced, not promised.', b: 'Delegation, scope, spend limits, sunset. All signed and verified at action time. The agent cannot exceed what its delegation authorizes.' },
  { h: 'Audit by default.', b: 'Every action produces a signed receipt. Every receipt is verifiable by your auditor without going through us. Open spec, open code.' },
  { h: 'Open at the protocol layer.', b: 'Apache 2.0 SDK, MCP, Python. The gateway service is a separate commercial product. Spec compatibility is permanent.' }].
  slice(0, pillarCount);

  return (
    <div data-aeoess-page="1" style={{ background: P.paper, color: P.ink, fontFamily, minHeight: '100%', WebkitFontSmoothing: 'antialiased' }}>
      {/* ─── Top nav ─────────────────────────────────────────────── */}
      <RestrainedHeader palette={P} pad={pad} />

      {/* ─── Body, single column OR two-column with Updates ─────── */}
      <section style={{ padding: `${sectionPadY}px ${pad}px ${sectionPadY - 30}px` }}>
        <div style={{
          maxWidth: showUpdates ? 1440 : 1200, margin: '0 auto',
          display: showUpdates ? 'grid' : 'block',
          gridTemplateColumns: showUpdates ? 'minmax(0, 1fr) 320px' : undefined,
          gap: showUpdates ? 56 : 0, alignItems: 'start'
        }}>

          {/* LEFT (or only), hero + arch + solutions + pillars + proof + CTA */}
          <div>
            {/* Hero, 2-col: copy left, demo video right (sits low, near "Built for…" line) */}
            <div style={{
              display: 'grid',
              gridTemplateColumns: 'minmax(0, 1fr) minmax(420px, 520px)',
              gap: 48, alignItems: 'end',
            }}>
              <div>
                <div style={{ fontSize: 11.5, letterSpacing: '0.14em', color: P.accentColor, fontWeight: 600, marginBottom: 20, textTransform: 'uppercase' }}>
                  Agent Passport System
                </div>
                <h1 style={{
                  lineHeight: 1.05, letterSpacing: '-0.02em',
                  fontWeight: 500, margin: 0, color: P.ink, fontSize: "54px"
                }}>
                  The governance<br />layer for AI agents.
                </h1>
                <p style={{ fontSize: 18, lineHeight: 1.5, color: P.ink3, marginTop: 24, maxWidth: 600, fontWeight: 400 }}>
                  Cryptographic identity, scoped delegation, and signed receipts.<br />
                  Built for the four jobs your agents already do.
                </p>

const STATUSES = [
  { k:'done',    label:'Done',    glyph:'●' },
  { k:'active',  label:'Active',  glyph:'◐' },

function statusColor(s, P) {
  return s === 'done'   ? P.green
       : s === 'active' ? P.accentColor
       : s === 'next'   ? P.blue
       : P.ink5;

// ── The Roadmap page ──────────────────────────────────────────────
function AeoessRoadmap({ palette }) {
  const P = palette;
  const pad = 40;
  const sectionPadY = 56;
  const mono = 'ui-monospace, SFMono-Regular, Menlo, monospace';

  // Gantt grid sizing
  const DAY_W       = 14;          // px per day
  const ROW_H       = 28;          // px per item row
  const ROW_GAP     = 6;
  const SWIM_PAD    = 16;          // top/bottom padding inside swimlane
  const LABEL_W     = 150;         // left swimlane label column
  const D_MIN       = 0;
  const D_MAX       = 95;
  const TIMELINE_W  = (D_MAX - D_MIN) * DAY_W;

  const TODAY = 64; // matches the YAML "Day 64" header note

  const dayX = (d) => (d - D_MIN) * DAY_W;

  // Group items per workstream + lay them out into row indexes
  const grouped = WORKSTREAMS.map(ws => {
    const items = ROADMAP.filter(it => it.w === ws.k).sort((a,b) => a.d0 - b.d0);
    // simple greedy lane packing so overlapping bars stack
    const lanes = []; // array of arrays of items
    items.forEach(it => {
      let placed = false;
      for (const lane of lanes) {
        if (lane[lane.length-1].d1 < it.d0) { lane.push(it); it._row = lanes.indexOf(lane); placed = true; break; }
      }
      if (!placed) { it._row = lanes.length; lanes.push([it]); }
    });
    return { ws, items, rowCount: Math.max(1, lanes.length) };
  });

  // Compute absolute Y coords so dependency arrows can be drawn
  const swimY = []; // [{ws, y0, h}]
  let cursor = 0;
  grouped.forEach(g => {
    const h = SWIM_PAD * 2 + g.rowCount * ROW_H + (g.rowCount - 1) * ROW_GAP;
    swimY.push({ ws: g.ws.k, y0: cursor, h });
    cursor += h;
  });
  const TOTAL_H = cursor;

  // Position lookup for a given item
  const positions = {};
  grouped.forEach((g, gi) => {
    g.items.forEach(it => {
      const sw = swimY[gi];
      const y = sw.y0 + SWIM_PAD + it._row * (ROW_H + ROW_GAP);
      const x0 = dayX(it.d0);
      const x1 = dayX(it.d1) + DAY_W * 0.8;
      positions[it.id] = { x0, x1, y, mid: y + ROW_H/2 };
    });
  });

  const weekTicks = [];
  for (let d = 0; d <= D_MAX; d += 7) weekTicks.push(d);

  // Stats counts for legend
  const counts = STATUSES.reduce((a, s) => ({ ...a, [s.k]: ROADMAP.filter(i => i.s === s.k).length }), {});

  return (
    <div data-aeoess-page="1" style={{ background:P.paper, color:P.ink, fontFamily:'-apple-system, "Inter", system-ui, sans-serif', minHeight:'100%' }}>
      <SubHeader palette={P} pad={pad}/>

      {/* Hero */}
      <section style={{ padding:`${sectionPadY}px ${pad}px ${sectionPadY-12}px` }}>
        <div style={{ maxWidth:1400, margin:'0 auto' }}>
          <SectionEyebrow palette={P}>Roadmap · YAML-driven</SectionEyebrow>
          <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:32, flexWrap:'wrap' }}>
            <div>
              <h1 style={{ fontSize:'clamp(36px, 4.4vw, 56px)', lineHeight:1.05, letterSpacing:'-0.025em', fontWeight:500, margin:0, color:P.ink }}>
                Every layer, every paper,<br/>every day shipped.
              </h1>
              <p style={{ fontSize:15.5, lineHeight:1.6, color:P.ink3, marginTop:18, maxWidth:680 }}>
                Day&nbsp;1 was 2026-02-17. Today is Day&nbsp;{TODAY}. The page below is generated from a single <code style={{ fontFamily:mono, fontSize:13, padding:'1px 6px', background:P.bg, border:`1px solid ${P.ruleLight}`, borderRadius:3 }}>roadmap.yaml</code>, edit and push, the page rebuilds.
              </p>
            </div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              <a href="https://github.com/aeoess/aeoess_web/blob/main/roadmap.yaml" style={secondaryBtn(P)}>View YAML source ↗</a>
              <a href="#" style={secondaryBtn(P)}>Subscribe to changes</a>
            </div>
          </div>
        </div>
      </section>

      {/* ── Visualization: Cross-Impl Interop ───────────────────────── */}
      <section style={{ padding:`72px ${pad}px`, borderTop:`1px solid ${P.ruleLight}`, background:P.bg }}>
        <div style={{ maxWidth:1080, margin:'0 auto' }}>
          <div style={{ fontSize:11, color:P.ink5, fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace', letterSpacing:'0.10em', textTransform:'uppercase', marginBottom:10 }}>Interop, in motion</div>
          <h2 style={{ fontSize:32, fontWeight:500, margin:0, letterSpacing:'-0.02em', color:P.ink }}>Six independent implementations. One byte-match.</h2>
          <p style={{ fontSize:15, color:P.ink3, lineHeight:1.6, marginTop:14, marginBottom:28, maxWidth:680 }}>
            Same fixture into qntm, AgentGraph, Foxbook, AgentID, Nobulex, and ArkForge. Identical SHA-256 across all six runs. CTEF v0.3.2 §A draft, public.
          </p>
          <div style={{ border:`1px solid ${P.ruleLight}`, borderRadius:6, overflow:'hidden', background:'#1c1c1e' }}>
            <iframe src="arch-interop.html" title="Cross-Impl Interop, visualization" loading="lazy"
              style={{ display:'block', width:'100%', height:560, border:0 }}/>
          </div>
        </div>
      </section>

      {/* Legend strip */}
      <section style={{ padding:`0 ${pad}px`, borderTop:`1px solid ${P.ruleLight}`, borderBottom:`1px solid ${P.ruleLight}`, background:P.bg }}>
        <div style={{ maxWidth:1400, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between', gap:24, padding:'14px 0', flexWrap:'wrap' }}>
          <div style={{ display:'flex', gap:22, alignItems:'center', flexWrap:'wrap' }}>
            <div style={{ fontSize:11, color:P.ink5, letterSpacing:'0.10em', textTransform:'uppercase', fontFamily:mono }}>Status</div>
            {STATUSES.map(s => (
              <div key={s.k} style={{ display:'flex', alignItems:'center', gap:8, fontSize:12.5, color:P.ink2 }}>
                <span style={{ color:statusColor(s.k, P), fontSize:13, lineHeight:1 }}>{s.glyph}</span>
                <span style={{ fontWeight:500 }}>{s.label}</span>
                <span style={{ color:P.ink5, fontFamily:mono, fontSize:11.5 }}>{counts[s.k] || 0}</span>
              </div>
            ))}
          </div>
          <div style={{ display:'flex', gap:18, alignItems:'center', flexWrap:'wrap' }}>
            <div style={{ fontSize:11, color:P.ink5, letterSpacing:'0.10em', textTransform:'uppercase', fontFamily:mono }}>Total</div>
            <div style={{ fontSize:13, color:P.ink2 }}><strong style={{ color:P.ink, fontWeight:600 }}>{ROADMAP.length}</strong> items across <strong style={{ color:P.ink, fontWeight:600 }}>{WORKSTREAMS.length}</strong> workstreams</div>
          </div>
        </div>
      </section>

      {/* Gantt chart */}
      <section style={{ padding:`${sectionPadY-20}px ${pad}px ${sectionPadY}px` }}>
        <div style={{ maxWidth:1400, margin:'0 auto' }}>
          <div style={{
            border:`1px solid ${P.ruleLight}`, borderRadius:6, overflow:'hidden', background:P.paper,
          }}>
            {/* Day axis header */}
            <div style={{ display:'flex', borderBottom:`1px solid ${P.ruleLight}`, background:P.bg }}>
              <div style={{ width:LABEL_W, flex:'none', padding:'10px 16px', borderRight:`1px solid ${P.ruleLight}`, fontSize:11, color:P.ink5, letterSpacing:'0.10em', textTransform:'uppercase', fontFamily:mono }}>Workstream</div>
              <div style={{ overflowX:'auto', flex:1 }}>
                <div style={{ width:TIMELINE_W, position:'relative', height:34 }}>
                  {weekTicks.map(d => (
                    <div key={d} style={{ position:'absolute', left:dayX(d), top:0, bottom:0, display:'flex', alignItems:'center', borderLeft: d === 0 ? 'none' : `1px solid ${P.ruleLight}`, paddingLeft:6, fontSize:11, color:P.ink5, fontFamily:mono }}>
                      Day&nbsp;{d}
                    </div>
                  ))}
                  {/* TODAY line label */}
                  <div style={{ position:'absolute', left:dayX(TODAY) - 18, top:8, fontSize:10.5, color:P.accentColor, fontFamily:mono, letterSpacing:'0.06em', textTransform:'uppercase', fontWeight:700 }}>Today</div>
                </div>
              </div>
            </div>

            {/* Body: swimlane labels + chart area */}
            <div style={{ display:'flex' }}>
              {/* Left labels column */}
              <div style={{ width:LABEL_W, flex:'none', borderRight:`1px solid ${P.ruleLight}` }}>
                {grouped.map((g, i) => {
                  const sw = swimY[i];
                  return (
                    <div key={g.ws.k} style={{
                      height:sw.h,
                      borderTop: i === 0 ? 'none' : `1px solid ${P.ruleLight}`,
                      padding:'14px 16px', display:'flex', flexDirection:'column', justifyContent:'flex-start',
                    }}>
                      <div style={{ fontSize:14, fontWeight:600, color:P.ink, letterSpacing:'-0.005em' }}>{g.ws.label}</div>
                      <div style={{ fontSize:11, color:P.ink5, fontFamily:mono, marginTop:4 }}>{g.items.length} items</div>
                    </div>
                  );
                })}
              </div>

              {/* Scrollable chart */}
              <div style={{ overflowX:'auto', flex:1 }}>
                <div style={{ width:TIMELINE_W, height:TOTAL_H, position:'relative' }}>
                  {/* Week gridlines */}
                  {weekTicks.map(d => (
                    <div key={d} style={{ position:'absolute', left:dayX(d), top:0, bottom:0, width:1, background: d === 0 ? 'transparent' : P.ruleLight }}/>
                  ))}
                  {/* TODAY indicator line */}
                  <div style={{ position:'absolute', left:dayX(TODAY), top:0, bottom:0, width:1, background:P.accentColor, opacity:0.65 }}/>
                  <div style={{ position:'absolute', left:dayX(TODAY) - 4, top:0, width:8, height:8, background:P.accentColor, borderRadius:'50%' }}/>

                  {/* Swimlane separators */}
                  {grouped.map((g, i) => i === 0 ? null : (
                    <div key={g.ws.k} style={{ position:'absolute', left:0, right:0, top:swimY[i].y0, height:1, background:P.ruleLight }}/>
                  ))}

                  {/* Dependency arrows (SVG layer) */}
                  <svg width={TIMELINE_W} height={TOTAL_H} style={{ position:'absolute', inset:0, pointerEvents:'none' }}>
                    <defs>
                      <marker id="rm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M0,0 L10,5 L0,10 z" fill={P.ink5}/>
                      </marker>
                    </defs>
                    {ROADMAP.flatMap(it => (it.deps || []).map(depId => {
                      const a = positions[depId]; const b = positions[it.id];
                      if (!a || !b) return null;
                      const x1 = a.x1, y1 = a.mid;
                      const x2 = b.x0,  y2 = b.mid;
                      const mx = Math.max(x1 + 8, x2 - 8);
                      return (
                        <path key={`${depId}-${it.id}`}
                          d={`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`}
                          fill="none" stroke={P.rule} strokeWidth="1" strokeDasharray="2 3"
                          markerEnd="url(#rm-arrow)"/>
                      );
                    }))}
                  </svg>

                  {/* Bars */}
                  {ROADMAP.map(it => {
                    const p = positions[it.id]; if (!p) return null;
                    const w = Math.max(DAY_W * 0.9, p.x1 - p.x0);
                    const c = statusColor(it.s, P);
                    const isMilestone = it.d0 === it.d1;
                    return (
                      <div key={it.id} title={`${it.title} · day ${it.d0}${it.d0!==it.d1 ? '–'+it.d1 : ''} · ${it.s}`}
                        style={{
                          position:'absolute', left:p.x0, top:p.y, height:ROW_H, width:w,
                          display:'flex', alignItems:'center', gap:8,
                          padding:'0 10px',
                          background: it.s === 'done' ? P.bg : P.paper,
                          border:`1px solid ${c}`,
                          borderLeft: `3px solid ${c}`,
                          borderRadius:3,
                          fontSize:12, color:P.ink, fontWeight:500,
                          whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
                          cursor:'default',
                          boxShadow: it.s === 'active' ? `0 0 0 2px ${P.paper}, 0 0 0 3px ${c}33` : 'none',
                        }}>
                        <span style={{ color:c, fontSize:11, lineHeight:1 }}>
                          {isMilestone ? '◆' : (it.s === 'done' ? '●' : it.s === 'active' ? '◐' : '○')}
                        </span>
                        <span style={{ overflow:'hidden', textOverflow:'ellipsis' }}>{it.title}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          <p style={{ fontSize:12, color:P.ink5, marginTop:14, fontStyle:'italic', maxWidth:780 }}>
            Bars are sized by day range. Dotted curves are explicit YAML <code style={{ fontFamily:mono }}>dependencies</code>. The vertical accent line marks the current day. Scroll horizontally to see the full backlog window.
          </p>
        </div>
      </section>

      {/* Per-workstream summary tables */}
      {WORKSTREAMS.map((ws, wi) => {
        const items = ROADMAP.filter(i => i.w === ws.k);
        return (
          <section key={ws.k} style={{ padding:`${sectionPadY-20}px ${pad}px`, borderTop:`1px solid ${P.ruleLight}`, background: wi % 2 ? P.bg : P.paper }}>
            <div style={{ maxWidth:1400, margin:'0 auto', display:'grid', gridTemplateColumns:'200px 1fr', gap:48 }}>
              <div>
                <div style={{ fontFamily:mono, fontSize:11, color:P.ink5, letterSpacing:'0.10em', textTransform:'uppercase' }}>§ {wi+1}</div>
                <h2 style={{ fontSize:22, fontWeight:500, letterSpacing:'-0.015em', color:P.ink, marginTop:6, lineHeight:1.2 }}>{ws.label}</h2>
                <div style={{ fontSize:12, color:P.ink4, marginTop:6 }}>{items.length} items · {items.filter(i=>i.s==='done').length} done</div>
              </div>
              <div>
                {items.map((it, i) => (
                  <div key={it.id} style={{
                    display:'grid', gridTemplateColumns:'70px 90px 1fr 80px',
                    gap:18, alignItems:'baseline',
                    padding:'12px 0', borderTop: i === 0 ? `1px solid ${P.rule}` : `1px solid ${P.ruleLight}`,
                  }}>
                    <span style={{ fontFamily:mono, fontSize:12, color:P.ink5 }}>
                      D{it.d0}{it.d0!==it.d1 ? `–${it.d1}` : ''}
                    </span>
                    <span style={{ fontSize:10.5, color:statusColor(it.s, P), letterSpacing:'0.08em', textTransform:'uppercase', fontWeight:700, fontFamily:mono }}>{it.s}</span>
                    <span style={{ fontSize:13.5, color:P.ink, fontWeight:500 }}>{it.title}</span>
                    <span style={{ fontFamily:mono, fontSize:11, color:P.ink5, textAlign:'right' }}>{it.id}</span>
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      })}

      <Footer palette={P} pad={pad}/>
    </div>
  );
}

Object.assign(window, { AeoessRoadmap });

</script>
  <script type="text/babel">
/* inlined from src/aeoess-solutions.jsx */
// aeoess-solutions.jsx, Payments, Content, Compliance, Enterprise
// Restrained design language. Reuses SubHeader, Footer, SectionEyebrow,
// primaryBtn, secondaryBtn, sectionH2 from aeoess-subpages-1 / aeoess-restrained.
// Voice canon: no em-dashes, no AI-tells, no "not X but Y", no validation openers.
// Public/private boundary respected: gateway is mentioned as a deployment option,
// product intelligence layer is not.

const {
  SubHeader, Footer, SectionEyebrow,
  primaryBtn, secondaryBtn, sectionH2, navLink,
} = window;

const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';

// ── Shared atoms ────────────────────────────────────────────────

    background:P.paper,
  };
  return (

      <span style={chip}><span style={{ width:6, height:6, borderRadius:'50%', background:P.green }}/>Live primitives</span>
      <span style={chip}>Apache-2.0</span>

function PillarCard({ palette: P, lead, body, refs }) {
  return (
    <div style={{
      padding:'24px 26px', border:`1px solid ${P.ruleLight}`, borderRadius:6,
      background:P.paper, display:'flex', flexDirection:'column', gap:12,
    }}>
