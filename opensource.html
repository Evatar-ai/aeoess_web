<div id="aeoessgate" style="display:none;position:fixed;inset:0;z-index:99990;background:rgba(10,14,20,.55);backdrop-filter:blur(3px);align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif"><div style="background:#fff;color:#0b1220;max-width:420px;width:calc(100% - 48px);border-radius:14px;padding:28px 26px;box-shadow:0 24px 70px rgba(0,0,0,.35)"><h2 style="margin:0 0 10px;font-size:20px;letter-spacing:-.01em">Sign up for the pilot</h2><p style="margin:0 0 18px;font-size:14.5px;line-height:1.55;color:#3c4657">aeoess runs as Model Citizen, an open pilot program. Access is by application.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a href="/model-citizen/" style="background:#0b1220;color:#fff;text-decoration:none;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600">Apply to the pilot</a><button onclick="document.getElementById('aeoessgate').style.display='none'" style="background:transparent;border:1px solid #cdd5e1;border-radius:999px;padding:10px 18px;font-size:14px;cursor:pointer;color:#0b1220">Continue</button></div></div></div><script>(function(){try{if(sessionStorage.getItem("aeoessPilotSeen"))return;setTimeout(function(){var g=document.getElementById("aeoessgate");if(!g)return;g.style.display="flex";sessionStorage.setItem("aeoessPilotSeen","1");},10000);}catch(e){}})();</script></body>
