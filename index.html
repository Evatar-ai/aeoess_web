<body data-view="chooser">
<canvas id="gl"></canvas>
<svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="mercg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#93aec4"/><stop offset=".18" stop-color="#eef5fb"/>
      <stop offset=".40" stop-color="#7fb0de"/><stop offset=".55" stop-color="#e9f2fa"/>
      <stop offset=".72" stop-color="#4a86c0"/><stop offset=".88" stop-color="#f4f9fd"/>
      <stop offset="1" stop-color="#8ab4dd"/>
      <animateTransform id="mercanim" attributeName="gradientTransform" type="translate"
        values="-0.22 0; 0.22 0; -0.22 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glassg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#dfeaf4" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2532"/><stop offset="1" stop-color="#0d141c"/>
    </linearGradient>
    <filter id="softsh" x="-30%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a4668" flood-opacity="0.22"/>
    </filter>
    <symbol id="mkword" viewBox="0 0 844.0 151.0"><g><path fill-rule="evenodd" d="M16 6 17 34 124 35 124 49 122 51 34 72 24 76 13 86 6 103 7 118 16 134 27 142 36 145 124 145 125 120 135 136 153 145 255 145 254 117 152 116 153 97 259 77 259 34 232 34 231 6 158 6 145 11 139 16 117 6Z M124 77 123 117 32 116 33 99 121 76Z M152 35 230 34 231 53 219 57 153 68Z"/></g><g><path fill-rule="evenodd" d="M528 29 517 14 501 6 427 6 407 16 395 9 384 6 313 6 302 9 286 21 277 39 276 104 279 118 292 136 312 145 389 144 407 134 418 118 419 145 523 145 523 117 419 117 418 115 422 98 502 79 516 72 523 65 529 53 530 36Z M557 13 548 23 543 35 544 54 555 71 570 79 662 99 663 116 549 117 549 145 657 145 673 139 685 125 689 111 685 91 674 78 658 71 570 52 568 50 568 35 676 34 676 6 573 6Z M705 14 697 23 692 35 692 51 696 61 704 71 719 79 811 99 812 116 698 117 698 145 806 145 820 140 831 130 837 117 838 104 833 89 823 78 811 72 726 54 717 50 718 34 825 34 825 6 722 6Z M420 72 421 34 504 35 503 52 423 73Z M304 35 391 34 392 116 305 117Z"/></g></symbol><symbol id="mkmono" viewBox="0 0 424.0 241.0"><g><path fill-rule="evenodd" d="M420 52 373 52 372 4 259 5 238 11 220 23 202 11 190 7 175 5 20 6 20 53 196 52 197 79 49 116 31 124 16 138 5 160 4 187 8 200 18 216 29 226 42 233 58 237 198 236 199 191 205 206 217 221 225 227 245 235 414 235 414 188 246 189 244 159 246 157 420 124Z M198 124 199 188 197 190 47 189 46 163 48 161 193 123Z M244 53 273 51 372 51 374 58 374 84 245 109Z"/></g></symbol>
  </defs>
</svg>

<section id="chooser" class="view on">
  <header class="bar">
    <svg class="mk hlogo fillink" viewBox="0 0 844.0 151.0"><use href="#mkword"/></svg>
    <span class="chip"><i class="dot"></i>threshold online</span>
  </header>
  <div class="mid">
    <div class="eyebrow">One threshold. Two forms of presence.</div>
    <h1>Who is entering?</h1>
    <div class="doors">
      <div class="door">
        <button class="pill" id="bh" onclick="choose('human',this)">Human</button>
        <span class="cap">Present in person</span>
      </div>
      <div class="door">
        <button class="pill agentbtn" id="ba" onclick="choose('agent',this)">Agent</button>
        <span class="cap">Acting with authority</span>
      </div>
    </div>
  </div>
  <footer class="bar">
    <span>Identity is the first boundary.</span>
    <span class="status" id="status">Awaiting answer</span>
    <span>01 / 02</span>
  </footer>
</section>
<script src="/assets/aeoess/entry/entry.js"></script>
</body>
</html>
