<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AEOESS — Payment Rails</title>
<meta name="description" content="Agent pays. Scope narrows. Merchant receives. Settlement record signed."/>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1c1c1e; }
  iframe { width:100%; height:100%; border:0; display:block; }
  /* Auto-scroll to top so the embedded scene fills the viewport */
</style>
</head>
<body>
<iframe
  src="protocol-architecture.html#scene=4&solo=1"
  title="Payment Rails — protocol architecture visualization"
  loading="lazy"
  allow="fullscreen"
  scrolling="no"></iframe>
<script>
  // Forward parent theme/edit-mode messages straight through to the embedded master.
  window.addEventListener('message', (e) => {
    const f = document.querySelector('iframe');
    if (f && f.contentWindow && e.source !== f.contentWindow) {
      try { f.contentWindow.postMessage(e.data, '*'); } catch(_) {}
    }
  });
</script>
</body>
</html>
