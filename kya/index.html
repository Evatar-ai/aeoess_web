  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; font-family: 'Geist', -apple-system, system-ui, sans-serif; color: #0c1130; }
    body { min-width: 0; overflow-x: hidden; }
    a { color: inherit; }
    *, *::before, *::after { box-sizing: border-box; }

    /* ──────────────────────────────────────────────────────
       Mobile responsive overrides
       Inline styles win over CSS unless we use !important.
       We match inline patterns with [style*=…] selectors.
       ────────────────────────────────────────────────────── */

    /* SVGs always shrink to container */
    svg { max-width: 100%; height: auto; }

    @media (max-width: 1100px) {
      /* Soften the 1440-tuned padding everywhere */
      [style*="padding: 20px 64px"] { padding: 14px 24px !important; }
      [style*="padding: 40px 64px"] { padding: 28px 24px !important; }
      [style*="padding: 72px 64px"], [style*="padding: 72px 64px 32px"] { padding: 56px 24px 28px !important; }
      [style*="padding: 80px 64px"], [style*="padding: 80px 64px 36px"] { padding: 60px 24px 28px !important; }
      [style*="padding: 88px 64px"], [style*="padding: 88px 64px 100px"] { padding: 60px 24px 60px !important; }
      [style*="padding: 110px 64px"] { padding: 70px 24px !important; }
      [style*="padding: 120px 64px"] { padding: 70px 24px !important; }
      [style*="padding: 120px 64px 0"] { padding: 70px 24px 0 !important; }
      [style*="padding: 160px 64px"] { padding: 80px 24px !important; }

      /* Collapse the standard two-column hero+visual to a stack */
      [style*="grid-template-columns: 1.15fr 1fr"],
      [style*="grid-template-columns: 1.1fr 1fr"],
      [style*="grid-template-columns: 1.05fr 1fr"],
      [style*="grid-template-columns: 1fr 1.05fr"],
      [style*="grid-template-columns: 1fr 1.1fr"],
      [style*="grid-template-columns: 1fr 1.15fr"],
      [style*="grid-template-columns: 1fr 1.2fr"],
      [style*="grid-template-columns: 1fr 1.3fr"],
      [style*="grid-template-columns: 1.2fr 1fr"],
      [style*="grid-template-columns: 1.3fr 1fr"],
      [style*="grid-template-columns: 1.4fr 1fr"],
      [style*="grid-template-columns: 1.6fr 1fr"],
      [style*="grid-template-columns: 1fr 1fr"] {
        grid-template-columns: 1fr !important;
        gap: 32px !important;
      }

      /* 3-col and 4-col card grids → 2 col tablet */
      [style*="grid-template-columns: repeat(3, 1fr)"],
      [style*="grid-template-columns: repeat(4, 1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }

      /* Footer 5-col → 2-col tablet */
      [style*="grid-template-columns: 1.3fr repeat(4, 1fr)"] {
        grid-template-columns: 1fr 1fr !important;
      }

      /* Sitemap 5-col → 2-col tablet */
      [style*="grid-template-columns: repeat(5, 1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    @media (max-width: 760px) {
      /* Collapse to single column at phone width */
      [style*="grid-template-columns: repeat(2, 1fr)"],
      [style*="grid-template-columns: repeat(3, 1fr)"],
      [style*="grid-template-columns: repeat(4, 1fr)"],
      [style*="grid-template-columns: repeat(5, 1fr)"],
      [style*="grid-template-columns: 1.3fr repeat(4, 1fr)"] {
        grid-template-columns: 1fr !important;
      }

      /* Tighter horizontal padding */
      [style*="padding: 56px 56px"] { padding: 32px 16px !important; }
      [style*="padding: 110px 64px"],
      [style*="padding: 120px 64px"],
      [style*="padding: 160px 64px"],
      [style*="padding: 88px 64px"],
      [style*="padding: 80px 64px"],
      [style*="padding: 72px 64px"],
      [style*="padding: 70px 24px"],
      [style*="padding: 80px 24px"],
      [style*="padding: 60px 24px"] {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }

      /* Section vertical breathing */
      [style*="padding: 110px 64px"],
      [style*="padding: 120px 64px"],
      [style*="padding: 160px 64px"] {
        padding-top: 56px !important;
        padding-bottom: 56px !important;
      }

      /* Headline scale-down — match common inline px sizes */
      [style*="font-size: 192px"] { font-size: 56px !important; }
      [style*="font-size: 168px"] { font-size: 52px !important; }
      [style*="font-size: 144px"] { font-size: 52px !important; }
      [style*="font-size: 132px"] { font-size: 48px !important; }
      [style*="font-size: 124px"] { font-size: 46px !important; }
      [style*="font-size: 104px"] { font-size: 40px !important; }
      [style*="font-size: 96px"]  { font-size: 38px !important; }
      [style*="font-size: 88px"]  { font-size: 34px !important; }
      [style*="font-size: 84px"]  { font-size: 34px !important; }
      [style*="font-size: 80px"]  { font-size: 32px !important; }
      [style*="font-size: 72px"]  { font-size: 30px !important; }
      [style*="font-size: 64px"]  { font-size: 28px !important; }
      [style*="font-size: 56px"]  { font-size: 26px !important; }
      [style*="font-size: 52px"]  { font-size: 26px !important; }
      [style*="font-size: 48px"]  { font-size: 24px !important; }
      [style*="font-size: 44px"]  { font-size: 22px !important; }
      [style*="font-size: 40px"]  { font-size: 22px !important; }
      [style*="font-size: 38px"]  { font-size: 20px !important; }
      [style*="font-size: 36px"]  { font-size: 20px !important; }
      [style*="font-size: 32px"]  { font-size: 20px !important; }
      [style*="font-size: 30px"]  { font-size: 19px !important; }
      [style*="font-size: 28px"]  { font-size: 18px !important; }
      [style*="font-size: 26px"]  { font-size: 17px !important; }
      [style*="font-size: 24px"]  { font-size: 16px !important; }
      [style*="font-size: 22px"]  { font-size: 15px !important; }
      [style*="font-size: 20px"]  { font-size: 15px !important; }

      /* Body-copy font sizes — keep readable, only shrink slightly */
      [style*="font-size: 18px"]  { font-size: 16px !important; }
      [style*="font-size: 17px"]  { font-size: 16px !important; }

      /* Tables → horizontal scroll instead of squashing */
      table {
        display: block !important;
        overflow-x: auto !important;
        white-space: nowrap !important;
        -webkit-overflow-scrolling: touch !important;
      }
      table thead, table tbody { display: table !important; width: 100%; min-width: 600px; }

      /* Nav: stack to compact mobile bar — hide middle links, show only logo + CTA */
      [data-kya-nav-links] { display: none !important; }
      [data-kya-nav-cta-secondary] { display: none !important; }

      /* Hero plate (translucent stacked panels) is 1100px-tuned and overflows badly.
         Hide it on phones — the hero copy + identity orbit lives below in the
         stats strip which still reads well. */
      [data-kya-hero-plate] {
        display: none !important;
      }

      /* Passport card — let it auto-size, ditch the rotation that overflows */
      [data-kya-passport-card] {
        transform: rotate(0deg) !important;
        padding: 22px !important;
      }
      [data-kya-passport-stack] { display: none !important; }
      [data-kya-verified-stamp] {
        position: static !important;
        transform: rotate(0deg) !important;
        display: inline-block !important;
        margin-bottom: 16px !important;
      }
      [data-kya-passport-photo] { width: 84px !important; height: 106px !important; }
      [data-kya-passport-grid] {
        grid-template-columns: 84px 1fr !important;
        gap: 16px !important;
      }
      [data-kya-mrz] { font-size: 9px !important; letter-spacing: 0.1em !important; }

      /* Logo wordmark — smaller subtitle line */
      [data-kya-wordmark-sub] { display: none !important; }

      /* Footer logo + copy stack */
      [data-kya-footer-grid] {
        grid-template-columns: 1fr !important;
        gap: 32px !important;
      }
      [data-kya-footer-bottom] {
        flex-direction: column !important;
        gap: 12px !important;
        align-items: flex-start !important;
      }

      /* CTA button rows — center-aligned and full width feel */
      [data-kya-cta-row] {
        flex-direction: column !important;
        width: 100% !important;
      }
      [data-kya-cta-row] > * { width: 100% !important; text-align: center !important; }

      /* Stats strip 4-col → 2-col phone */
      [data-kya-stats] {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 24px 16px !important;
      }

      /* Tablet/desktop visuals that don't make sense on phones */
      [data-kya-desktop-only] { display: none !important; }
    }

    /* Touch-friendly tap targets */
    @media (hover: none) and (pointer: coarse) {
      a, button { -webkit-tap-highlight-color: transparent; }
    }
  </style>
