<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — AEOESS</title>
<meta name="description" content="AEOESS governance dashboard. View tenant, agents, delegations, receipts, and manage API keys.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/images/aeoess_logo-05.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: rgb(28,28,30); color: rgb(236,236,236); font-family: -apple-system, Inter, system-ui, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: rgb(124,172,222); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 40px; }
  header.site { border-bottom: 1px solid rgb(46,46,50); background: rgb(36,36,38); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px); }
  header.site .inner { display: flex; align-items: center; gap: 24px; padding: 14px 40px; max-width: 1280px; margin: 0 auto; }
  header.site .brand { display: flex; align-items: center; gap: 8px; color: rgb(236,236,236); text-decoration: none; }
  header.site .brand img { height: 24px; }
  header.site nav { display: flex; align-items: center; gap: 24px; font-size: 13px; color: rgb(221,221,221); margin-left: 8px; }
  header.site nav a { color: rgb(176,176,176); }
  header.site .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  header.site .right a { color: rgb(176,176,176); font-size: 13px; }
  header.site .right .signout { padding: 6px 12px; border: 1px solid rgb(58,58,62); border-radius: 4px; background: transparent; color: rgb(221,221,221); cursor: pointer; font-size: 12.5px; font-family: inherit; }
  header.site .right .signout:hover { border-color: rgb(90,90,94); }
  main { padding: 48px 0 80px; }
  h1 { font-size: clamp(28px, 3.4vw, 42px); font-weight: 500; letter-spacing: -0.02em; margin: 0 0 6px; line-height: 1.15; }
  .sub { color: rgb(176,176,176); font-size: 14px; margin-bottom: 32px; }
  .welcome { padding: 18px 22px; border: 1px solid rgb(58,108,80); background: rgb(28,46,38); color: rgb(168,224,184); border-radius: 6px; margin-bottom: 24px; display: none; }
  .welcome.show { display: block; }
  .welcome h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .welcome p { margin: 0; font-size: 13px; line-height: 1.5; }
  .welcome .key-row { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  .welcome .key-row input { flex: 1; padding: 8px 12px; background: rgb(16,28,22); border: 1px solid rgb(58,108,80); color: rgb(168,224,184); border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .welcome .key-row button { padding: 8px 14px; background: rgb(168,224,184); color: rgb(16,28,22); border: 0; border-radius: 4px; font-weight: 500; font-size: 12.5px; cursor: pointer; }
  .signin-card { max-width: 460px; margin: 80px auto; padding: 40px; border: 1px solid rgb(46,46,50); border-radius: 8px; background: rgb(36,36,38); }
  .signin-card h2 { font-size: 22px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.01em; }
  .signin-card p { color: rgb(176,176,176); font-size: 13px; line-height: 1.5; margin: 0 0 22px; }
  .signin-card label { display: block; font-size: 12px; color: rgb(138,138,142); margin-bottom: 6px; font-weight: 500; }
  .signin-card input { width: 100%; padding: 10px 14px; font-size: 13px; color: rgb(236,236,236); border: 1px solid rgb(58,58,62); border-radius: 4px; background: rgb(28,28,30); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .signin-card .submit { width: 100%; margin-top: 12px; padding: 11px 16px; background: rgb(236,236,236); color: rgb(36,36,38); border: 0; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .signin-card .hint { margin-top: 18px; padding-top: 18px; border-top: 1px solid rgb(46,46,50); font-size: 12px; color: rgb(138,138,142); line-height: 1.55; }
  .signin-card .signin-err { margin-top: 10px; padding: 10px 14px; background: rgb(46,28,32); color: rgb(236,168,176); border: 1px solid rgb(116,58,68); border-radius: 4px; font-size: 12.5px; display: none; }
  .tenant-card { padding: 24px 28px; border: 1px solid rgb(46,46,50); border-radius: 8px; background: rgb(36,36,38); margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .tenant-card .left h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.005em; }
  .tenant-card .left .email { font-size: 13px; color: rgb(138,138,142); margin-top: 4px; }
  .tenant-card .right { display: flex; align-items: center; gap: 12px; }
  .badge { display: inline-flex; align-items: center; padding: 4px 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; }
  .badge.plan-free { background: rgb(28,40,55); color: rgb(178,206,236); }
  .badge.plan-pro { background: rgb(40,30,55); color: rgb(206,178,236); }
  .badge.plan-enterprise { background: rgb(46,32,18); color: rgb(236,206,134); }
  .badge.status-active { background: rgb(28,46,38); color: rgb(168,224,184); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat { padding: 22px 24px; border: 1px solid rgb(46,46,50); border-radius: 8px; background: rgb(36,36,38); }
  .stat .label { font-size: 11px; color: rgb(138,138,142); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
  .stat .value { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; color: rgb(236,236,236); }
  .stat .footnote { font-size: 11.5px; color: rgb(138,138,142); margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .section { padding: 28px 28px 24px; border: 1px solid rgb(46,46,50); border-radius: 8px; background: rgb(36,36,38); margin-bottom: 24px; }
  .section h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: -0.005em; }
  .section .desc { font-size: 12.5px; color: rgb(138,138,142); margin: 0 0 18px; line-height: 1.5; }
  .keys-table { width: 100%; border-collapse: collapse; }
  .keys-table th { text-align: left; font-size: 10.5px; color: rgb(138,138,142); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; padding: 8px 0; border-bottom: 1px solid rgb(46,46,50); }
  .keys-table td { padding: 12px 0; font-size: 13px; color: rgb(221,221,221); border-bottom: 1px solid rgb(46,46,50); }
  .keys-table tr:last-child td { border-bottom: 0; }
  .keys-table .key-prefix { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: rgb(236,236,236); }
  .keys-table .revoked { color: rgb(138,138,142); text-decoration: line-through; }
  .keys-table button { padding: 5px 10px; background: transparent; border: 1px solid rgb(58,58,62); color: rgb(221,221,221); border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .keys-table button:hover { border-color: rgb(90,90,94); }
  .quickstart { background: rgb(20,20,22); border: 1px solid rgb(46,46,50); border-radius: 8px; overflow: hidden; }
  .quickstart .hd { padding: 16px 22px 12px; }
  .quickstart .hd .label { font-size: 11px; color: rgb(138,138,142); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .quickstart .hd .title { font-size: 14px; font-weight: 500; color: rgb(236,236,236); }
  .quickstart pre { margin: 0; padding: 18px 22px; background: rgb(16,16,18); color: rgb(178,206,236); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.65; overflow-x: auto; white-space: pre; border-top: 1px solid rgb(46,46,50); }
  .loading { padding: 80px 40px; text-align: center; color: rgb(138,138,142); font-size: 13px; }
  .error-banner { padding: 16px 20px; background: rgb(46,28,32); color: rgb(236,168,176); border: 1px solid rgb(116,58,68); border-radius: 6px; margin-bottom: 24px; font-size: 13px; }
  footer.site { border-top: 1px solid rgb(46,46,50); background: rgb(36,36,38); color: rgb(138,138,142); font-size: 12px; padding: 24px 40px; text-align: center; }
  footer.site a { color: rgb(176,176,176); }
  @media (max-width: 720px) {
    .container { padding: 0 20px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .tenant-card { flex-direction: column; align-items: flex-start; }
    .tenant-card .right { width: 100%; justify-content: flex-start; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="inner">
    <a href="/" class="brand">
      <img src="/assets/images/aeoess_logo-05.png" alt="AEOESS">
      <span style="font-size:13px;font-weight:600;letter-spacing:0.04em;">AEOESS</span>
    </a>
    <nav>
      <a href="/passport.html">Spec</a>
      <a href="/docs.html">Docs</a>
      <a href="/pricing.html">Pricing</a>
      <a href="/blog.html">Blog</a>
    </nav>
    <div class="right">
      <a href="https://gateway.aeoess.com" target="_blank" class="mono" style="font-size:11.5px;">gateway.aeoess.com</a>
      <button class="signout" id="signout-btn" style="display:none;">Sign out</button>
    </div>
  </div>
</header>

<main>
  <div class="container" id="root">
    <div class="loading">Loading…</div>
  </div>
</main>

<footer class="site">
  © 2026 AEOESS · <a href="mailto:signal@aeoess.com">signal@aeoess.com</a> · <a href="/portal.html">Portal</a>
</footer>

<script>
(function() {
  var GATEWAY = 'https://gateway.aeoess.com';
  var KEY_STORAGE = 'aps_api_key';
  var TENANT_STORAGE = 'aps_tenant_id';

  function getKey() {
    var hash = window.location.hash || '';
    var m = hash.match(/welcome=([^&]+)/);
    if (m) {
      var k = decodeURIComponent(m[1]);
      try { localStorage.setItem(KEY_STORAGE, k); } catch(e) {}
      return { key: k, fresh: true };
    }
    try {
      var stored = localStorage.getItem(KEY_STORAGE);
      if (stored) return { key: stored, fresh: false };
    } catch(e) {}
    return null;
  }

  function clearKey() {
    try {
      localStorage.removeItem(KEY_STORAGE);
      localStorage.removeItem(TENANT_STORAGE);
    } catch(e) {}
  }

  function api(path, opts) {
    var key = (getKey() || {}).key;
    if (!key) return Promise.reject(new Error('no_key'));
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Bearer ' + key;
    if (opts.body) opts.headers['Content-Type'] = 'application/json';
    return fetch(GATEWAY + path, opts).then(function(r) {
      return r.json().then(function(j) { return { status: r.status, body: j }; });
    });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"\u0027]/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"\u0027":'&#39;'}[c]); }); }

  function fmtNum(n) { if (n < 0) return '\u221E'; return Number(n).toLocaleString(); }
  function fmtLimit(n) { if (n === -1 || n == null) return 'unlimited'; return Number(n).toLocaleString(); }
  function fmtDate(s) {
    if (!s) return '\u2014';
    try {
      var d = new Date(s.replace(' ', 'T') + 'Z');
      var diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff/60) + ' min ago';
      if (diff < 86400) return Math.floor(diff/3600) + ' h ago';
      if (diff < 30*86400) return Math.floor(diff/86400) + ' d ago';
      return d.toISOString().slice(0,10);
    } catch(e) { return s; }
  }

  function renderSignIn(errorMsg) {
    var root = document.getElementById('root');
    root.innerHTML = ''
      + '<div class="signin-card">'
      + '<h2>Sign in to your dashboard</h2>'
      + '<p>Paste the API key you received when you signed up.</p>'
      + '<label for="key-input">API key</label>'
      + '<input id="key-input" type="text" placeholder="aps_live_..." autocomplete="off" spellcheck="false">'
      + '<div class="signin-err" id="signin-err"' + (errorMsg ? ' style="display:block;"' : '') + '>' + (errorMsg ? esc(errorMsg) : '') + '</div>'
      + '<button class="submit" id="signin-submit">Continue \u2192</button>'
      + '<div class="hint">'
      +   'New here? <a href="/portal.html">Create an account \u2192</a><br>'
      +   'Lost your key? Email <a href="mailto:signal@aeoess.com">signal@aeoess.com</a>'
      + '</div>'
      + '</div>';

    function submit() {
      var k = (document.getElementById('key-input').value || '').trim();
      if (!k.startsWith('aps_live_') && !k.startsWith('aps_test_')) {
        showSigninErr("That doesn\u0027t look like an API key. Keys start with aps_live_\u2026");
        return;
      }
      try { localStorage.setItem(KEY_STORAGE, k); } catch(e) {}
      load();
    }
    document.getElementById('signin-submit').addEventListener('click', submit);
    document.getElementById('key-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    document.getElementById('key-input').focus();
  }
  function showSigninErr(msg) {
    var el = document.getElementById('signin-err');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
  }

  function renderDashboard(account, fresh, freshKey) {
    var root = document.getElementById('root');
    var planClass = 'plan-' + esc(account.plan);
    var planLabel = account.plan.charAt(0).toUpperCase() + account.plan.slice(1);
    var statusClass = 'status-' + esc(account.status);

    document.getElementById('signout-btn').style.display = 'inline-flex';

    var welcomeHtml = '';
    if (fresh && freshKey) {
      welcomeHtml = ''
        + '<div class="welcome show">'
        +   '<h3>\uD83C\uDF89 Your account is live.</h3>'
        +   '<p>Copy your API key and save it somewhere safe. This is the only place you\u0027ll see it in full \u2014 after this you\u0027ll only see the prefix.</p>'
        +   '<div class="key-row">'
        +     '<input id="fresh-key" type="text" value="' + esc(freshKey) + '" readonly>'
        +     '<button id="fresh-copy">Copy</button>'
        +   '</div>'
        + '</div>';
    }

    var keysRows = (account.api_keys || []).map(function(k) {
      var cls = k.revoked_at ? 'revoked' : '';
      var actions = k.revoked_at ? '<span style="color:rgb(138,138,142);font-size:11.5px;">revoked</span>' : '';
      return ''
        + '<tr>'
        +   '<td class="key-prefix ' + cls + '">' + esc(k.prefix) + '\u2026</td>'
        +   '<td class="' + cls + '">' + esc(k.name) + '</td>'
        +   '<td class="' + cls + '">' + esc(fmtDate(k.created_at)) + '</td>'
        +   '<td class="' + cls + '">' + esc(fmtDate(k.last_used_at)) + '</td>'
        +   '<td style="text-align:right;">' + actions + '</td>'
        + '</tr>';
    }).join('');

    var rotateBlock = ''
      + '<div style="margin-top:16px;padding-top:16px;border-top:1px solid rgb(46,46,50);font-size:12.5px;color:rgb(138,138,142);">'
      +   'Need to rotate? <button id="rotate-btn" style="padding:5px 10px;margin-left:8px;background:transparent;border:1px solid rgb(58,58,62);color:rgb(221,221,221);border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;">Rotate key</button>'
      +   '<span style="margin-left:8px;font-size:11.5px;">Issues a new key alongside the current one; revoke the old one when you\u0027ve switched over.</span>'
      + '</div>';

    var stats = account.usage || {};
    var limits = account.limits || {};

    var firstKey = (account.api_keys && account.api_keys[0]) ? account.api_keys[0] : null;
    var quickstartKey = freshKey || (firstKey ? firstKey.prefix + '\u2026' : 'aps_live_\u2026');

    root.innerHTML = ''
      + welcomeHtml
      + '<h1>Governance dashboard</h1>'
      + '<div class="sub">Live state of your AEOESS tenant.</div>'
      + '<div class="tenant-card">'
      +   '<div class="left">'
      +     '<h2>' + esc(account.name) + '</h2>'
      +     '<div class="email">' + esc(account.email) + ' \u00B7 <span class="mono" style="font-size:11.5px;color:rgb(90,90,94);">' + esc(account.tenant_id) + '</span></div>'
      +   '</div>'
      +   '<div class="right">'
      +     '<span class="badge ' + planClass + '">' + esc(planLabel) + '</span>'
      +     '<span class="badge ' + statusClass + '">' + esc(account.status) + '</span>'
      +   '</div>'
      + '</div>'
      + '<div class="stats">'
      +   '<div class="stat"><div class="label">Agents</div><div class="value">' + fmtNum(stats.agents || 0) + '</div><div class="footnote">limit \u00B7 ' + fmtLimit(limits.max_agents) + '</div></div>'
      +   '<div class="stat"><div class="label">Delegations</div><div class="value">' + fmtNum(stats.delegations || 0) + '</div><div class="footnote">active</div></div>'
      +   '<div class="stat"><div class="label">Evals this month</div><div class="value">' + fmtNum(stats.evaluations_this_month || 0) + '</div><div class="footnote">limit \u00B7 ' + fmtLimit(limits.evaluations_per_month) + '</div></div>'
      +   '<div class="stat"><div class="label">Receipts</div><div class="value">' + fmtNum(stats.receipts || 0) + '</div><div class="footnote">signed \u00B7 verifiable</div></div>'
      + '</div>'
      + '<div class="section">'
      +   '<h3>API keys</h3>'
      +   '<p class="desc">These keys authenticate every call to the gateway. Treat them like passwords; rotate if exposed.</p>'
      +   '<table class="keys-table">'
      +     '<thead><tr><th>Key</th><th>Name</th><th>Created</th><th>Last used</th><th></th></tr></thead>'
      +     '<tbody>' + keysRows + '</tbody>'
      +   '</table>'
      +   rotateBlock
      + '</div>'
      + '<div class="section" style="padding:0;border:0;background:transparent;">'
      +   '<div class="quickstart">'
      +     '<div class="hd"><div class="label">Quickstart</div><div class="title">Make your first authenticated call</div></div>'
      +     '<pre>curl -H "Authorization: Bearer ' + esc(quickstartKey) + '" \\\n     ' + GATEWAY + '/api/v1/account</pre>'
      +   '</div>'
      + '</div>'
      + '<div class="section" style="background:transparent;border:0;padding:0;margin-top:32px;color:rgb(138,138,142);font-size:12.5px;text-align:center;">'
      +   'Need a Pro or Enterprise plan, additional keys, or compliance reports? Email <a href="mailto:signal@aeoess.com">signal@aeoess.com</a>.'
      + '</div>';

    var fc = document.getElementById('fresh-copy');
    if (fc) {
      fc.addEventListener('click', function() {
        var input = document.getElementById('fresh-key');
        input.select();
        try {
          document.execCommand('copy');
          fc.textContent = 'Copied \u2713';
          setTimeout(function() { fc.textContent = 'Copy'; }, 1500);
        } catch(e) {}
      });
    }

    var rb = document.getElementById('rotate-btn');
    if (rb) {
      rb.addEventListener('click', function() {
        if (!confirm('Issue a new API key? Your current key will keep working until you revoke it.')) return;
        rb.disabled = true;
        rb.textContent = 'Rotating\u2026';
        api('/api/v1/account/rotate-key', { method: 'POST' }).then(function(res) {
          if (res.status === 200 && res.body.api_key) {
            try { localStorage.setItem(KEY_STORAGE, res.body.api_key); } catch(e) {}
            window.location.hash = 'welcome=' + encodeURIComponent(res.body.api_key);
            load();
          } else {
            alert('Rotate failed: ' + (res.body.error || 'unknown'));
            rb.disabled = false;
            rb.textContent = 'Rotate key';
          }
        }).catch(function() {
          alert('Rotate failed: network error');
          rb.disabled = false;
          rb.textContent = 'Rotate key';
        });
      });
    }
  }

  function load() {
    var ctx = getKey();
    if (!ctx) {
      renderSignIn();
      return;
    }
    var freshKey = ctx.fresh ? ctx.key : null;
    if (ctx.fresh) {
      try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
    }
    document.getElementById('root').innerHTML = '<div class="loading">Loading your dashboard\u2026</div>';
    api('/api/v1/account').then(function(res) {
      if (res.status === 401) {
        clearKey();
        renderSignIn("That API key isn\u0027t valid anymore. Sign in with a current key.");
        return;
      }
      if (res.status !== 200) {
        document.getElementById('root').innerHTML = '<div class="error-banner">Could not load account: ' + esc(res.body.error || 'HTTP ' + res.status) + '</div>';
        return;
      }
      renderDashboard(res.body, ctx.fresh, freshKey);
    }).catch(function(err) {
      console.error('[dashboard]', err);
      document.getElementById('root').innerHTML = '<div class="error-banner">Could not reach the gateway. Check your network connection and try again.</div>';
    });
  }

  document.getElementById('signout-btn').addEventListener('click', function() {
    if (!confirm('Sign out and forget your API key on this device?')) return;
    clearKey();
    window.location.hash = '';
    load();
  });

  load();
})();
</script>

</body>
</html>
