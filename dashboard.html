<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — AEOESS</title>
  <meta name="description" content="AEOESS governance dashboard. Live state of your tenant: agents, delegations, receipts, evaluations.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/images/aeoess_logo-05.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #1c1c1e; color: #ececec; min-height: 100vh;
      font-family: -apple-system, "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .loading { padding: 80px 40px; text-align: center; color: #8a8a8e; font-size: 13px; }
    /* Sign-in fallback */
    .signin-card { max-width: 460px; margin: 80px auto; padding: 40px;
      border: 1px solid #2e2e32; border-radius: 8px; background: #242426; }
    .signin-card h2 { font-size: 22px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.01em; }
    .signin-card p { color: #b0b0b0; font-size: 13px; line-height: 1.5; margin: 0 0 22px; }
    .signin-card label { display: block; font-size: 12px; color: #8a8a8e; margin-bottom: 6px; font-weight: 500; }
    .signin-card input { width: 100%; padding: 10px 14px; font-size: 13px; color: #ececec;
      border: 1px solid #3a3a3e; border-radius: 4px; background: #1c1c1e;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .signin-card .submit { width: 100%; margin-top: 12px; padding: 11px 16px;
      background: #ececec; color: #242426; border: 0; border-radius: 4px;
      font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .signin-card .hint { margin-top: 18px; padding-top: 18px; border-top: 1px solid #2e2e32;
      font-size: 12px; color: #8a8a8e; line-height: 1.55; }
    .signin-card .signin-err { margin-top: 10px; padding: 10px 14px;
      background: #2e1c20; color: #ecaab0; border: 1px solid #743a44; border-radius: 4px;
      font-size: 12.5px; display: none; }
    .signin-card a { color: #7cacde; text-decoration: none; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"><div class="loading">Loading dashboard…</div></div>

  <script type="text/babel">
  /* ─────────────────────────────────────────────────────────────────
     AEOESS Dashboard
     Single React component. Authenticates via an aps_live_* key stored
     in localStorage (or freshly arrived in #welcome=...), fetches the
     tenant's live state from gateway.aeoess.com, and renders the slick
     enforcement view (metric tiles, decisions feed, environment widget,
     working action buttons). Falls back to a sign-in card when no key.
     ───────────────────────────────────────────────────────────────── */

  const GATEWAY = 'https://gateway.aeoess.com';
  const KEY_STORAGE = 'aps_api_key';

  const P = {
    bg:        '#1c1c1e',
    paper:     '#242426',
    surface:   '#2a2a2e',
    ink:       '#ececec',
    ink2:      '#dddddd',
    ink3:      '#b0b0b0',
    ink4:      '#8a8a8e',
    ink5:      '#5a5a5e',
    rule:      '#3a3a3e',
    ruleLight: '#2e2e32',
    link:      '#7cacde',
    green:     '#4ade80',
    blue:      '#60a5fa',
    red:       '#f87171',
    amber:     '#f59e0b',
  };

  const MONO = '"IBM Plex Mono", ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace';

  // ───── Storage + key handling ─────────────────────────────────────
  function readWelcomeKey() {
    const m = (window.location.hash || '').match(/welcome=([^&]+)/);
    if (m) {
      const k = decodeURIComponent(m[1]);
      try { localStorage.setItem(KEY_STORAGE, k); } catch(e) {}
      try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
      return { key: k, fresh: true };
    }
    try {
      const stored = localStorage.getItem(KEY_STORAGE);
      if (stored) return { key: stored, fresh: false };
    } catch(e) {}
    return null;
  }
  function clearKey() {
    try { localStorage.removeItem(KEY_STORAGE); localStorage.removeItem('aps_tenant_id'); } catch(e) {}
  }

  function api(path, key, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + key });
    if (opts.body) opts.headers['Content-Type'] = 'application/json';
    return fetch(GATEWAY + path, opts).then(r => r.json().then(j => ({ status: r.status, body: j })));
  }

  // ───── Format helpers ─────────────────────────────────────────────
  const fmtNum = (n) => n == null ? '—' : n < 0 ? '∞' : Number(n).toLocaleString();
  const fmtLimit = (n) => n === -1 || n == null ? 'unlimited' : Number(n).toLocaleString();
  const fmtMs = (ms) => ms == null ? '—' : Number(ms).toFixed(0) + 'ms';
  const fmtPct = (r) => r == null ? '—' : (Number(r) * 100).toFixed(2) + '%';
  const fmtTime = (iso) => {
    if (!iso) return '—';
    try {
      const d = new Date(String(iso).replace(' ', 'T') + (String(iso).includes('Z') ? '' : 'Z'));
      return d.toISOString().substr(11, 8);
    } catch(e) { return iso; }
  };
  const fmtRel = (iso) => {
    if (!iso) return '—';
    try {
      const d = new Date(String(iso).replace(' ', 'T') + (String(iso).includes('Z') ? '' : 'Z'));
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff/60) + ' min ago';
      if (diff < 86400) return Math.floor(diff/3600) + ' h ago';
      if (diff < 30*86400) return Math.floor(diff/86400) + ' d ago';
      return d.toISOString().slice(0,10);
    } catch(e) { return iso; }
  };

  // ───── Sub-components ─────────────────────────────────────────────
  function Header({ tenant, onSignOut }) {
    return (
      <header style={{ borderBottom:`1px solid ${P.ruleLight}`, background:P.paper, position:'sticky', top:0, zIndex:5, backdropFilter:'blur(8px)' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', display:'flex', alignItems:'center', gap:24, padding:'14px 40px' }}>
          <a href="/" style={{ display:'flex', alignItems:'center', gap:8, color:P.ink, textDecoration:'none' }}>
            <img src="/assets/images/aeoess_logo-05.png" alt="AEOESS" style={{ height:22, width:'auto' }}/>
            <span style={{ fontSize:13, fontWeight:600, letterSpacing:'0.04em' }}>AEOESS</span>
          </a>
          <nav style={{ display:'flex', alignItems:'center', gap:24, fontSize:13, color:P.ink3, marginLeft:8 }}>
            <a href="/passport.html" style={{ color:P.ink3 }}>Spec</a>
            <a href="/docs.html"     style={{ color:P.ink3 }}>Docs</a>
            <a href="/pricing.html"  style={{ color:P.ink3 }}>Pricing</a>
            <a href="/blog.html"     style={{ color:P.ink3 }}>Blog</a>
          </nav>
          <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:14 }}>
            <span style={{ color:P.ink4, fontSize:11.5, fontFamily:MONO }}>gateway.aeoess.com</span>
            {tenant ? <span style={{ color:P.ink4, fontSize:12 }}>{tenant.email}</span> : null}
            <button onClick={onSignOut}
              style={{ padding:'6px 12px', border:`1px solid ${P.rule}`, borderRadius:4, background:'transparent', color:P.ink2, cursor:'pointer', fontSize:12.5, fontFamily:'inherit' }}>
              Sign out
            </button>
          </div>
        </div>
      </header>
    );
  }

  function Stat({ label, value, sub, color }) {
    return (
      <div style={{ padding:'22px 24px', border:`1px solid ${P.ruleLight}`, borderRadius:8, background:P.paper }}>
        <div style={{ fontSize:11, color:P.ink4, letterSpacing:'0.06em', textTransform:'uppercase', fontWeight:600, marginBottom:8 }}>{label}</div>
        <div style={{ fontSize:32, fontWeight:500, letterSpacing:'-0.02em', color: color || P.ink }}>{value}</div>
        <div style={{ fontSize:11.5, color:P.ink4, marginTop:4, fontFamily:MONO }}>{sub}</div>
      </div>
    );
  }

  function DecisionsFeed({ rows, status }) {
    if (rows.length === 0) {
      return (
        <div style={{ padding:'48px 18px', textAlign:'center', color:P.ink4, fontSize:13 }}>
          {status === 'idle'    ? 'No policy evaluations recorded yet. They will appear here as agents call /api/v1/evaluate.'
          : status === 'error'  ? 'Could not load the decisions feed. Try again in a moment.'
          : 'Loading recent decisions…'}
        </div>
      );
    }
    return (
      <table style={{ width:'100%', borderCollapse:'collapse', fontFamily:MONO, fontSize:12.5 }}>
        <tbody>
          {rows.map((r, i) => {
            const allow = r.decision === 'permit' || r.decision === 'allow';
            const color = allow ? P.green : P.red;
            return (
              <tr key={r.id || i}>
                <td style={{ padding:'10px 18px', color:P.ink5, borderTop: i ? `1px solid ${P.ruleLight}` : 'none', whiteSpace:'nowrap' }}>{fmtTime(r.ts)}</td>
                <td style={{ padding:'10px 12px', borderTop: i ? `1px solid ${P.ruleLight}` : 'none' }}>
                  <span style={{ display:'inline-block', padding:'2px 8px', borderRadius:3, fontSize:11, letterSpacing:'0.04em',
                    background: color + '1f', color, fontWeight:600 }}>
                    {String(r.decision || '').toUpperCase()}
                  </span>
                </td>
                <td style={{ padding:'10px 12px', color:P.ink4, borderTop: i ? `1px solid ${P.ruleLight}` : 'none' }}>{fmtMs(r.duration_ms)}</td>
                <td style={{ padding:'10px 12px', color:P.ink2, borderTop: i ? `1px solid ${P.ruleLight}` : 'none' }}>{(r.agent_id || '').slice(0, 10)}…</td>
                <td style={{ padding:'10px 12px', color:P.ink3, borderTop: i ? `1px solid ${P.ruleLight}` : 'none' }}>{r.action_type}</td>
                <td style={{ padding:'10px 18px', color:P.ink2, borderTop: i ? `1px solid ${P.ruleLight}` : 'none', textAlign:'right' }}>{r.scope_required}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    );
  }

  function ReceiptsList({ rows, status, onClose }) {
    return (
      <div style={{ background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, marginTop:24 }}>
        <div style={{ padding:'14px 18px', borderBottom:`1px solid ${P.ruleLight}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ fontSize:13, fontWeight:600, color:P.ink }}>Recent receipts</div>
          <button onClick={onClose} style={{ background:'transparent', border:`1px solid ${P.rule}`, borderRadius:4, padding:'4px 10px', color:P.ink3, fontSize:11.5, cursor:'pointer', fontFamily:'inherit' }}>Close</button>
        </div>
        {rows.length === 0
          ? <div style={{ padding:'32px 18px', textAlign:'center', color:P.ink4, fontSize:13 }}>{status === 'loading' ? 'Loading receipts…' : 'No receipts yet.'}</div>
          : (
            <table style={{ width:'100%', borderCollapse:'collapse', fontFamily:MONO, fontSize:12.5 }}>
              <thead>
                <tr style={{ color:P.ink4, fontSize:10.5, letterSpacing:'0.06em', textTransform:'uppercase' }}>
                  <th style={{ textAlign:'left', padding:'10px 18px', fontWeight:600 }}>When</th>
                  <th style={{ textAlign:'left', padding:'10px 12px', fontWeight:600 }}>Verdict</th>
                  <th style={{ textAlign:'left', padding:'10px 12px', fontWeight:600 }}>Agent</th>
                  <th style={{ textAlign:'left', padding:'10px 12px', fontWeight:600 }}>Action</th>
                  <th style={{ textAlign:'left', padding:'10px 18px', fontWeight:600 }}>Receipt id</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => {
                  const allow = r.verdict === 'permit' || r.verdict === 'allow';
                  const color = allow ? P.green : P.red;
                  return (
                    <tr key={r.id || i}>
                      <td style={{ padding:'10px 18px', color:P.ink5, borderTop: `1px solid ${P.ruleLight}` }}>{fmtRel(r.created_at)}</td>
                      <td style={{ padding:'10px 12px', borderTop: `1px solid ${P.ruleLight}` }}>
                        <span style={{ display:'inline-block', padding:'2px 8px', borderRadius:3, fontSize:11, background: color+'1f', color, fontWeight:600 }}>
                          {String(r.verdict || '').toUpperCase()}
                        </span>
                      </td>
                      <td style={{ padding:'10px 12px', color:P.ink2, borderTop: `1px solid ${P.ruleLight}` }}>{(r.agent_id || '').slice(0, 12)}…</td>
                      <td style={{ padding:'10px 12px', color:P.ink3, borderTop: `1px solid ${P.ruleLight}` }}>{r.action_type}</td>
                      <td style={{ padding:'10px 18px', color:P.ink4, borderTop: `1px solid ${P.ruleLight}`, fontFamily:MONO }}>{String(r.id || '').slice(0, 12)}…</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )
        }
      </div>
    );
  }

  // ───── Sign-in screen (no key in storage) ─────────────────────────
  function SignIn({ initialError, onKey }) {
    const [err, setErr] = React.useState(initialError || '');
    const [val, setVal] = React.useState('');
    const submit = () => {
      const k = val.trim();
      if (!k.startsWith('aps_live_') && !k.startsWith('aps_test_')) {
        setErr("That doesn't look like an API key. Keys start with aps_live_…");
        return;
      }
      try { localStorage.setItem(KEY_STORAGE, k); } catch(e) {}
      onKey(k);
    };
    return (
      <div className="signin-card">
        <h2>Sign in to your dashboard</h2>
        <p>Paste the API key you received when you signed up — or <a href="/portal.html">sign in via portal</a>.</p>
        <label htmlFor="key-input">API key</label>
        <input id="key-input" type="text" placeholder="aps_live_..." autoComplete="off" spellCheck="false"
          value={val} onChange={e => setVal(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }} />
        {err ? <div className="signin-err" style={{display:'block'}}>{err}</div> : null}
        <button className="submit" onClick={submit}>Continue →</button>
        <div className="hint">
          New here? <a href="/portal.html">Create an account →</a><br/>
          Lost your key? <a href="/portal.html">Reset via portal</a> or email <a href="mailto:signal@aeoess.com">signal@aeoess.com</a>.
        </div>
      </div>
    );
  }

  // ───── Main dashboard ─────────────────────────────────────────────
  function Dashboard({ apiKey, freshKey, onSignOut }) {
    const [account, setAccount] = React.useState(null);
    const [dash, setDash] = React.useState(null);
    const [decisions, setDecisions] = React.useState([]);
    const [decisionsStatus, setDecisionsStatus] = React.useState('loading');
    const [envState, setEnvState] = React.useState({
      gateway: { v:'loading…', s:'amber' },
      jwks:    { v:'loading…', s:'amber' },
      bundle:  { v:'co-deployed with gateway', s:'green' },
      trust:   { v:'multi-issuer feed live',   s:'green' },
    });
    const [showReceipts, setShowReceipts] = React.useState(false);
    const [receipts, setReceipts] = React.useState([]);
    const [receiptsStatus, setReceiptsStatus] = React.useState('idle');
    const [busy, setBusy] = React.useState(null);
    const [toast, setToast] = React.useState(null);

    // Initial + periodic loads
    React.useEffect(() => {
      let cancelled = false;
      let pollDecisions, pollDash;

      const loadAccount = () => api('/api/v1/account', apiKey).then(res => {
        if (cancelled) return;
        if (res.status === 401) { clearKey(); onSignOut('Your API key is no longer valid.'); return; }
        if (res.status === 200) setAccount(res.body);
      });

      const loadDash = () => api('/api/v1/dashboard', apiKey).then(res => {
        if (cancelled) return;
        if (res.status === 200) setDash(res.body);
      }).catch(()=>{});

      const loadDecisions = () => api('/api/v1/decisions/recent?limit=20', apiKey).then(res => {
        if (cancelled) return;
        if (res.status === 200) {
          setDecisions(res.body.decisions || []);
          setDecisionsStatus((res.body.decisions || []).length > 0 ? 'live' : 'idle');
        } else { setDecisionsStatus('error'); }
      }).catch(() => { if (!cancelled) setDecisionsStatus('error'); });

      const loadEnv = () => {
        fetch(GATEWAY + '/healthz').then(r => r.json()).then(d => {
          if (!cancelled) setEnvState(s => ({ ...s, gateway: { v: 'v' + (d.version || '?') + ' · us-west', s:'green' } }));
        }).catch(() => { if (!cancelled) setEnvState(s => ({ ...s, gateway: { v:'unreachable', s:'red' } })); });
        fetch(GATEWAY + '/.well-known/jwks.json').then(r => r.ok ? r.json() : null).then(d => {
          if (cancelled) return;
          if (d && d.keys && d.keys.length > 0) {
            setEnvState(s => ({ ...s, jwks: { v: 'kid: ' + (d.keys[0].kid || 'unknown'), s:'green' } }));
          } else {
            setEnvState(s => ({ ...s, jwks: { v: 'no keys advertised', s:'amber' } }));
          }
        }).catch(() => { if (!cancelled) setEnvState(s => ({ ...s, jwks: { v:'unreachable', s:'red' } })); });
      };

      loadAccount(); loadDash(); loadDecisions(); loadEnv();
      pollDash = setInterval(loadDash, 30_000);
      pollDecisions = setInterval(loadDecisions, 10_000);
      return () => { cancelled = true; clearInterval(pollDash); clearInterval(pollDecisions); };
    }, [apiKey]);

    const showToast = (msg, kind) => { setToast({ msg, kind: kind || 'info' }); setTimeout(() => setToast(null), 4000); };

    // Action: rotate key
    const onRotate = () => {
      if (!confirm('Issue a new API key alongside the current one? Your current key keeps working until you revoke it.')) return;
      setBusy('rotate');
      api('/api/v1/account/rotate-key', apiKey, { method: 'POST' }).then(res => {
        setBusy(null);
        if (res.status === 200 && res.body.api_key) {
          try { localStorage.setItem(KEY_STORAGE, res.body.api_key); } catch(e) {}
          showToast('New key issued. Save it: ' + res.body.api_key.substr(0, 16) + '…', 'success');
          // Re-render with the new key so the keys table updates
          window.location.hash = 'welcome=' + encodeURIComponent(res.body.api_key);
          window.location.reload();
        } else {
          showToast('Rotate failed: ' + (res.body.error || 'unknown'), 'error');
        }
      }).catch(() => { setBusy(null); showToast('Rotate failed: network error', 'error'); });
    };

    // Action: open portal
    const onOpenPortal = () => { window.open('/portal.html', '_self'); };

    // Action: view receipts (toggle)
    const onViewReceipts = () => {
      if (showReceipts) { setShowReceipts(false); return; }
      setShowReceipts(true);
      setReceiptsStatus('loading');
      api('/api/v1/receipts/recent?limit=20', apiKey).then(res => {
        if (res.status === 200) { setReceipts(res.body.receipts || []); setReceiptsStatus(res.body.receipts && res.body.receipts.length ? 'live' : 'idle'); }
        else { setReceiptsStatus('error'); }
      }).catch(() => setReceiptsStatus('error'));
    };

    // Action: cascade revoke — admin guard via the portal flow
    const onCascadeRevoke = () => {
      const agentId = prompt('Cascade revoke: enter the agent_id at the root of the tree to revoke.\nAll downstream delegations cascade-revoke.\n\nThis is irreversible.');
      if (!agentId || !agentId.trim()) return;
      if (!confirm('Cascade-revoke agent ' + agentId.trim() + ' and all its descendants?')) return;
      setBusy('revoke');
      api('/api/v1/revoke', apiKey, { method: 'POST', body: JSON.stringify({ agent_id: agentId.trim(), reason: 'manual cascade revoke from dashboard' }) }).then(res => {
        setBusy(null);
        if (res.status >= 200 && res.status < 300) {
          showToast('Cascade revoke issued for ' + agentId.trim() + '. Downstream delegations invalidated.', 'success');
        } else {
          showToast('Revoke failed: ' + (res.body && res.body.error ? res.body.error : 'HTTP ' + res.status), 'error');
        }
      }).catch(() => { setBusy(null); showToast('Revoke failed: network error', 'error'); });
    };

    if (!account) {
      return (
        <div>
          <Header tenant={null} onSignOut={() => onSignOut()}/>
          <div className="loading">Loading your tenant…</div>
        </div>
      );
    }

    const PLAN_LABEL = String(account.plan || '').charAt(0).toUpperCase() + String(account.plan || '').slice(1);
    const usage = account.usage || {};
    const limits = account.limits || {};

    return (
      <div style={{ background:P.bg, color:P.ink, minHeight:'100%' }}>
        <Header tenant={account} onSignOut={onSignOut}/>

        {/* Hero strip */}
        <section style={{ padding:'40px 40px 28px', background:P.paper, borderBottom:`1px solid ${P.ruleLight}` }}>
          <div style={{ maxWidth:1280, margin:'0 auto', display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:32, flexWrap:'wrap' }}>
            <div>
              <div style={{ fontFamily:MONO, fontSize:11, color:P.ink5, letterSpacing:'0.10em', textTransform:'uppercase', marginBottom:8 }}>
                {account.email} · <span style={{ color:P.ink4 }}>{String(account.tenant_id).substr(0, 8)}…</span>
              </div>
              <h1 style={{ fontSize:'clamp(28px, 3.4vw, 44px)', lineHeight:1.1, letterSpacing:'-0.02em', fontWeight:500, margin:0 }}>
                Live enforcement.
              </h1>
              <div style={{ marginTop:8, color:P.ink3, fontSize:14 }}>
                {account.name} · {PLAN_LABEL} · {account.status}
              </div>
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <span style={{ display:'inline-flex', alignItems:'center', gap:8, padding:'8px 14px', border:`1px solid ${P.ruleLight}`, borderRadius:999, fontSize:12.5, color:P.ink3 }}>
                <span style={{ width:8, height:8, borderRadius:'50%', background:P.green }}/>
                {envState.gateway.s === 'green' ? 'Gateway healthy' : 'Gateway degraded'}
              </span>
              <a href="/portal.html" style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'9px 16px', border:`1px solid ${P.rule}`, borderRadius:4, fontSize:13, color:P.ink2, background:'transparent' }}>
                Open portal →
              </a>
            </div>
          </div>
        </section>

        {/* Stats */}
        <section style={{ padding:'28px 40px 12px' }}>
          <div style={{ maxWidth:1280, margin:'0 auto', display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:16 }}>
            <Stat label="Agents"            value={fmtNum(usage.agents)}                  sub={'limit · ' + fmtLimit(limits.max_agents)}/>
            <Stat label="Delegations"       value={fmtNum(usage.delegations)}             sub={'active'}/>
            <Stat label="Evals this month"  value={fmtNum(usage.evaluations_this_month)}  sub={'limit · ' + fmtLimit(limits.evaluations_per_month)}/>
            <Stat label="Receipts"          value={fmtNum(usage.receipts)}                sub={'signed · verifiable'}/>
          </div>
        </section>

        {/* Two-col: live feed + environment */}
        <section style={{ padding:'12px 40px 16px' }}>
          <div style={{ maxWidth:1280, margin:'0 auto', display:'grid', gridTemplateColumns:'2fr 1fr', gap:16 }}>
            {/* Feed */}
            <div style={{ background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, overflow:'hidden' }}>
              <div style={{ padding:'14px 18px', borderBottom:`1px solid ${P.ruleLight}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                <div style={{ fontSize:13, fontWeight:600, color:P.ink }}>Live decisions</div>
                <div style={{ fontSize:11, color: decisionsStatus === 'live' ? P.green : P.ink5, fontFamily:MONO, letterSpacing:'0.08em', textTransform:'uppercase' }}>
                  {decisionsStatus === 'live'  ? 'live · last 20'
                  : decisionsStatus === 'idle' ? 'no evaluations yet'
                  : decisionsStatus === 'error'? 'feed error' : 'loading…'}
                </div>
              </div>
              <DecisionsFeed rows={decisions} status={decisionsStatus}/>
            </div>

            {/* Environment + actions */}
            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
              <div style={{ background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8 }}>
                <div style={{ padding:'14px 18px', borderBottom:`1px solid ${P.ruleLight}`, fontSize:13, fontWeight:600, color:P.ink }}>Environment</div>
                {[
                  { k:'gateway.aeoess.com', v: envState.gateway.v, s: envState.gateway.s },
                  { k:'JWKS',               v: envState.jwks.v,    s: envState.jwks.s },
                  { k:'Policy bundle',      v: envState.bundle.v,  s: envState.bundle.s },
                  { k:'Trust feed',         v: envState.trust.v,   s: envState.trust.s },
                ].map((e, i) => {
                  const dot = e.s === 'green' ? P.green : e.s === 'red' ? P.red : P.amber;
                  return (
                    <div key={e.k} style={{ padding:'12px 18px', borderTop: i ? `1px solid ${P.ruleLight}` : 'none',
                      display:'grid', gridTemplateColumns:'14px 1fr', gap:10, alignItems:'baseline' }}>
                      <span style={{ width:8, height:8, borderRadius:'50%', background:dot, marginTop:4 }}/>
                      <div>
                        <div style={{ fontSize:13, color:P.ink, fontWeight:500 }}>{e.k}</div>
                        <div style={{ fontFamily:MONO, fontSize:11.5, color:P.ink4, marginTop:2 }}>{e.v}</div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div style={{ background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, padding:'18px 20px' }}>
                <div style={{ fontSize:13, fontWeight:600, color:P.ink, marginBottom:10 }}>Quick actions</div>
                <div style={{ display:'grid', gap:8 }}>
                  <button onClick={onOpenPortal} style={actionBtn}>
                    <span>Open portal</span><span style={{ color:P.ink5, fontFamily:MONO }}>→</span>
                  </button>
                  <button onClick={onViewReceipts} style={actionBtn}>
                    <span>{showReceipts ? 'Hide receipts' : 'View receipts'}</span><span style={{ color:P.ink5, fontFamily:MONO }}>{showReceipts ? '×' : '→'}</span>
                  </button>
                  <button onClick={onRotate} disabled={busy === 'rotate'} style={actionBtn}>
                    <span>{busy === 'rotate' ? 'Rotating…' : 'Rotate gateway key'}</span><span style={{ color:P.ink5, fontFamily:MONO }}>→</span>
                  </button>
                  <button onClick={onCascadeRevoke} disabled={busy === 'revoke'} style={actionBtn}>
                    <span>{busy === 'revoke' ? 'Revoking…' : 'Issue cascade revoke'}</span><span style={{ color:P.ink5, fontFamily:MONO }}>→</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        {/* Receipts (collapsible) */}
        {showReceipts ? (
          <section style={{ padding:'4px 40px 16px' }}>
            <div style={{ maxWidth:1280, margin:'0 auto' }}>
              <ReceiptsList rows={receipts} status={receiptsStatus} onClose={() => setShowReceipts(false)}/>
            </div>
          </section>
        ) : null}

        {/* API keys */}
        <section style={{ padding:'12px 40px 40px' }}>
          <div style={{ maxWidth:1280, margin:'0 auto', background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, padding:'24px 24px 18px' }}>
            <div style={{ fontSize:14, fontWeight:600, color:P.ink, marginBottom:4 }}>API keys</div>
            <div style={{ fontSize:12.5, color:P.ink4, marginBottom:14 }}>These authenticate every call to the gateway. Treat them like passwords; rotate if exposed.</div>
            <table style={{ width:'100%', borderCollapse:'collapse', fontFamily:MONO, fontSize:12.5 }}>
              <thead>
                <tr style={{ color:P.ink4, fontSize:10.5, letterSpacing:'0.06em', textTransform:'uppercase' }}>
                  <th style={{ textAlign:'left',  padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Key</th>
                  <th style={{ textAlign:'left',  padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Name</th>
                  <th style={{ textAlign:'left',  padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Created</th>
                  <th style={{ textAlign:'left',  padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Last used</th>
                  <th style={{ textAlign:'right', padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}></th>
                </tr>
              </thead>
              <tbody>
                {(account.api_keys || []).map((k, i) => (
                  <tr key={k.prefix + i}>
                    <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.ink5 : P.ink }}>{k.prefix}…</td>
                    <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.ink5 : P.ink2 }}>{k.name}</td>
                    <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.ink5 : P.ink3 }}>{fmtRel(k.created_at)}</td>
                    <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.ink5 : P.ink3 }}>{fmtRel(k.last_used_at)}</td>
                    <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color:P.ink5, fontSize:11.5, textAlign:'right' }}>{k.revoked_at ? 'revoked' : ''}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>

        {/* Footer */}
        <footer style={{ borderTop:`1px solid ${P.ruleLight}`, background:P.paper, color:P.ink4, fontSize:12, padding:'24px 40px', textAlign:'center' }}>
          © 2026 AEOESS · <a href="mailto:signal@aeoess.com" style={{ color:P.ink3 }}>signal@aeoess.com</a> · <a href="/portal.html" style={{ color:P.ink3 }}>Portal</a>
        </footer>

        {/* Toast */}
        {toast ? (
          <div style={{ position:'fixed', bottom:24, right:24, padding:'12px 18px', borderRadius:6,
            background: toast.kind === 'error' ? P.red + '1f' : toast.kind === 'success' ? P.green + '1f' : P.paper,
            color: toast.kind === 'error' ? P.red : toast.kind === 'success' ? P.green : P.ink,
            border:`1px solid ${P.rule}`, fontSize:13, maxWidth:520, zIndex:50 }}>
            {toast.msg}
          </div>
        ) : null}
      </div>
    );
  }

  const actionBtn = {
    background:'transparent', border:'1px solid #3a3a3e', borderRadius:4, padding:'10px 12px',
    color:'#dddddd', cursor:'pointer', fontSize:13, fontFamily:'inherit',
    display:'flex', justifyContent:'space-between', alignItems:'center',
  };

  function App() {
    const [ctx, setCtx] = React.useState(() => readWelcomeKey());
    const [signinErr, setSigninErr] = React.useState(null);

    const onSignOut = (msg) => { clearKey(); setSigninErr(msg || null); setCtx(null); };

    if (!ctx) return <SignIn initialError={signinErr} onKey={k => setCtx({ key: k, fresh: false })}/>;
    return <Dashboard apiKey={ctx.key} freshKey={ctx.fresh ? ctx.key : null} onSignOut={onSignOut}/>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
