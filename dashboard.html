<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — AEOESS</title>
  <meta name="description" content="AEOESS governance dashboard. Live tenant state, agents, delegations, receipts, and integration setup.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/images/aeoess_logo-05.png">

  <!--
    Content Security Policy.
    - script-src 'unsafe-inline' is required for the React-via-Babel approach.
      Mitigated by rendering every value through React (auto-escaped), never
      using dangerouslySetInnerHTML on API responses.
    - unpkg.com is the only third-party script origin (React + Babel pinned).
    - connect-src locks all API calls to the AEOESS gateway.
    - Frames are blocked (no clickjacking surface).
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://unpkg.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    connect-src 'self' https://gateway.aeoess.com;
    img-src 'self' data: https://aeoess.com;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
  ">
  <meta http-equiv="Referrer-Policy" content="no-referrer-when-downgrade">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #1c1c1e; color: #ececec; min-height: 100vh;
      font-family: "Inter", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .loading { padding: 80px 40px; text-align: center; color: #8a8a8e; font-size: 13px; }

    /* Sign-in fallback card */
    .signin-card { max-width: 460px; margin: 80px auto; padding: 40px;
      border: 1px solid #2e2e32; border-radius: 8px; background: #242426; }
    .signin-card h2 { font-size: 22px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.01em; }
    .signin-card p  { color: #b0b0b0; font-size: 13px; line-height: 1.5; margin: 0 0 22px; }
    .signin-card label { display: block; font-size: 12px; color: #8a8a8e; margin-bottom: 6px; font-weight: 500; }
    .signin-card input { width: 100%; padding: 10px 14px; font-size: 13px; color: #ececec;
      border: 1px solid #3a3a3e; border-radius: 4px; background: #1c1c1e;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .signin-card .submit { width: 100%; margin-top: 12px; padding: 11px 16px;
      background: #ececec; color: #242426; border: 0; border-radius: 4px;
      font-size: 14px; font-weight: 500; cursor: pointer; }
    .signin-card .hint { margin-top: 18px; padding-top: 18px; border-top: 1px solid #2e2e32;
      font-size: 12px; color: #8a8a8e; line-height: 1.55; }
    .signin-card .signin-err { margin-top: 10px; padding: 10px 14px;
      background: #2e1c20; color: #ecaab0; border: 1px solid #743a44; border-radius: 4px;
      font-size: 12.5px; display: none; }
    .signin-card a { color: #7cacde; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"><div class="loading">Loading dashboard…</div></div>

  <script type="text/babel">
  /* ─────────────────────────────────────────────────────────────────
     AEOESS Dashboard — single-page React-via-Babel.
     Sections (anchored, sticky sub-nav):
       1. Hero      — tenant identity, health pill, last-rotation prompt
       2. Stats     — 4 live tiles (clickable to drill)
       3. Live      — decisions feed + environment
       4. Connect   — MCP / Cursor / TypeScript / Python / curl tabs
       5. Agents    — list + search + register
       6. Delegations
       7. Receipts  — signed receipts with verify-hash link
       8. Keys      — issue / rotate / revoke per key
       9. Danger    — cascade revoke with type-to-confirm
     ───────────────────────────────────────────────────────────────── */

  const GATEWAY = 'https://gateway.aeoess.com';
  const KEY_STORAGE = 'aps_api_key';

  const P = {
    bg:'#1c1c1e', paper:'#242426', surface:'#2a2a2e', surface2:'#323236',
    ink:'#ececec', ink2:'#dddddd', ink3:'#b0b0b0', ink4:'#8a8a8e', ink5:'#5a5a5e',
    rule:'#3a3a3e', ruleLight:'#2e2e32',
    link:'#7cacde', linkHover:'#a0c8f0',
    green:'#4ade80', blue:'#60a5fa', red:'#f87171', amber:'#f59e0b', purple:'#c084fc',
  };
  const MONO = '"IBM Plex Mono", ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace';

  // ───── Auth + storage ─────────────────────────────────────────────
  function readWelcomeKey() {
    const m = (window.location.hash || '').match(/welcome=([^&]+)/);
    if (m) {
      const k = decodeURIComponent(m[1]);
      try { localStorage.setItem(KEY_STORAGE, k); } catch(e) {}
      try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
      return { key: k, fresh: true };
    }
    try {
      const stored = localStorage.getItem(KEY_STORAGE);
      if (stored) return { key: stored, fresh: false };
    } catch(e) {}
    return null;
  }
  function clearKey() {
    try { localStorage.removeItem(KEY_STORAGE); localStorage.removeItem('aps_tenant_id'); } catch(e) {}
  }
  function api(path, key, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + key });
    if (opts.body) opts.headers['Content-Type'] = 'application/json';
    return fetch(GATEWAY + path, opts).then(r => r.json().then(j => ({ status: r.status, body: j })).catch(() => ({ status: r.status, body: {} })));
  }

  // ───── Formatters ─────────────────────────────────────────────────
  const fmtNum   = (n) => n == null ? '—' : n < 0 ? '∞' : Number(n).toLocaleString();
  const fmtLimit = (n) => n === -1 || n == null ? 'unlimited' : Number(n).toLocaleString();
  const fmtMs    = (ms) => ms == null ? '—' : Number(ms).toFixed(0) + 'ms';
  const fmtTime  = (iso) => {
    if (!iso) return '—';
    try {
      const d = new Date(String(iso).replace(' ', 'T') + (String(iso).includes('Z') ? '' : 'Z'));
      return d.toISOString().substr(11, 8);
    } catch(e) { return iso; }
  };
  const fmtRel = (iso) => {
    if (!iso) return '—';
    try {
      const d = new Date(String(iso).replace(' ', 'T') + (String(iso).includes('Z') ? '' : 'Z'));
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60)     return 'just now';
      if (diff < 3600)   return Math.floor(diff/60) + ' min ago';
      if (diff < 86400)  return Math.floor(diff/3600) + ' h ago';
      if (diff < 30*86400) return Math.floor(diff/86400) + ' d ago';
      return d.toISOString().slice(0,10);
    } catch(e) { return iso; }
  };
  const truncMid = (s, headLen, tailLen) => {
    if (!s) return '—';
    if (s.length <= headLen + tailLen + 1) return s;
    return s.substr(0, headLen) + '…' + s.substr(-tailLen);
  };

  // ───── Reusable primitives ────────────────────────────────────────
  function CopyButton({ value, label, masked }) {
    const [copied, setCopied] = React.useState(false);
    const onCopy = () => {
      const text = masked ? masked : value;
      // Always copy the REAL value, not the masked display — same convention as Stripe.
      navigator.clipboard.writeText(value).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1200); }).catch(() => {});
    };
    return (
      <button onClick={onCopy} aria-label={'Copy ' + (label || 'value')}
        style={{ padding:'4px 10px', fontSize:11, color: copied ? P.green : P.ink3,
          background:'transparent', border:`1px solid ${copied ? P.green : P.rule}`, borderRadius:4, cursor:'pointer' }}>
        {copied ? 'copied ✓' : 'copy'}
      </button>
    );
  }

  function Pill({ children, color, dot }) {
    return (
      <span style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'4px 10px',
        fontSize:11, fontWeight:600, letterSpacing:'0.04em', textTransform:'uppercase',
        borderRadius:999, background: color + '1f', color }}>
        {dot ? <span style={{ width:6, height:6, borderRadius:'50%', background: color }}/> : null}
        {children}
      </span>
    );
  }

  function Toast({ toast }) {
    if (!toast) return null;
    const color = toast.kind === 'error' ? P.red : toast.kind === 'success' ? P.green : P.blue;
    return (
      <div role="status" aria-live="polite" style={{ position:'fixed', bottom:24, right:24, zIndex:60,
        padding:'12px 18px', borderRadius:6, background: color + '1f', color,
        border:`1px solid ${color}`, fontSize:13, maxWidth:520 }}>
        {toast.msg}
      </div>
    );
  }

  // ───── Sign-in fallback ───────────────────────────────────────────
  function SignIn({ initialError, onKey }) {
    const [err, setErr] = React.useState(initialError || '');
    const [val, setVal] = React.useState('');
    const submit = () => {
      const k = val.trim();
      if (!k.startsWith('aps_live_') && !k.startsWith('aps_test_')) {
        setErr("That doesn't look like an API key. Keys start with aps_live_…");
        return;
      }
      try { localStorage.setItem(KEY_STORAGE, k); } catch(e) {}
      onKey(k);
    };
    return (
      <div className="signin-card">
        <h2>Sign in to your dashboard</h2>
        <p>Paste your API key — or <a href="/portal.html">sign in via portal</a>.</p>
        <label htmlFor="key-input">API key</label>
        <input id="key-input" type="password" placeholder="aps_live_..." autoComplete="off" spellCheck="false"
          value={val} onChange={e => setVal(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }} />
        {err ? <div className="signin-err" style={{display:'block'}}>{err}</div> : null}
        <button className="submit" onClick={submit}>Continue →</button>
        <div className="hint">
          New here? <a href="/portal.html">Create an account →</a><br/>
          Lost your key? <a href="/portal.html">Reset via portal</a>.
        </div>
      </div>
    );
  }

  // ───── Header / Sub-nav ───────────────────────────────────────────
  const NAV_SECTIONS = [
    { id:'overview',     label:'Overview' },
    { id:'live',         label:'Live' },
    { id:'connect',      label:'Connect' },
    { id:'integrations', label:'Integrations' },
    { id:'compliance',   label:'Compliance' },
    { id:'agents',       label:'Agents' },
    { id:'delegations',  label:'Delegations' },
    { id:'receipts',     label:'Receipts' },
    { id:'audit',        label:'Audit log' },
    { id:'keys',         label:'Keys' },
    { id:'danger',       label:'Danger zone' },
  ];

  function Header({ tenant, onSignOut, active, onNav }) {
    return (
      <header style={{ borderBottom:`1px solid ${P.ruleLight}`, background:P.paper, position:'sticky', top:0, zIndex:5, backdropFilter:'blur(8px)' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', display:'flex', alignItems:'center', gap:24, padding:'14px 40px' }}>
          <a href="/" style={{ display:'flex', alignItems:'center', gap:8 }}>
            <img src="/assets/images/aeoess_logo-05.png" alt="AEOESS" style={{ height:22 }}/>
            <span style={{ fontSize:13, fontWeight:600, letterSpacing:'0.04em', color:P.ink }}>AEOESS</span>
          </a>
          <nav style={{ display:'flex', alignItems:'center', gap:24, fontSize:13, marginLeft:8 }}>
            <a href="/passport.html" style={{ color:P.ink3 }}>Spec</a>
            <a href="/docs.html"     style={{ color:P.ink3 }}>Docs</a>
            <a href="/pricing.html"  style={{ color:P.ink3 }}>Pricing</a>
            <a href="/blog.html"     style={{ color:P.ink3 }}>Blog</a>
          </nav>
          <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:14 }}>
            <span style={{ color:P.ink4, fontSize:11.5, fontFamily:MONO }}>gateway.aeoess.com</span>
            {tenant ? <span style={{ color:P.ink4, fontSize:12 }}>{tenant.email}</span> : null}
            <button onClick={onSignOut}
              style={{ padding:'6px 12px', border:`1px solid ${P.rule}`, borderRadius:4, background:'transparent', color:P.ink2, cursor:'pointer', fontSize:12.5 }}>
              Sign out
            </button>
          </div>
        </div>
        {/* Sub-nav: section anchors */}
        <div style={{ borderTop:`1px solid ${P.ruleLight}`, background:P.bg }}>
          <div style={{ maxWidth:1280, margin:'0 auto', display:'flex', gap:4, padding:'0 40px', overflowX:'auto' }}>
            {NAV_SECTIONS.map(s => (
              <button key={s.id} onClick={() => onNav(s.id)}
                style={{ padding:'12px 14px', background:'transparent', border:0,
                  borderBottom: `2px solid ${active === s.id ? P.ink : 'transparent'}`,
                  color: active === s.id ? P.ink : P.ink4, fontSize:12.5, fontWeight:500, cursor:'pointer' }}>
                {s.label}
              </button>
            ))}
          </div>
        </div>
      </header>
    );
  }

  // ───── Hero ───────────────────────────────────────────────────────
  function Hero({ account, envHealthy }) {
    const PLAN_LABEL = String(account.plan || '').charAt(0).toUpperCase() + String(account.plan || '').slice(1);
    return (
      <section id="overview" style={{ padding:'40px 40px 24px', background:P.paper, borderBottom:`1px solid ${P.ruleLight}` }}>
        <div style={{ maxWidth:1280, margin:'0 auto', display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:32, flexWrap:'wrap' }}>
          <div>
            <div style={{ fontFamily:MONO, fontSize:11, color:P.ink5, letterSpacing:'0.10em', textTransform:'uppercase', marginBottom:8 }}>
              {account.email} · <span style={{ color:P.ink4 }}>{truncMid(account.tenant_id, 8, 4)}</span>
            </div>
            <h1 style={{ fontSize:'clamp(28px, 3.4vw, 44px)', lineHeight:1.1, letterSpacing:'-0.02em', fontWeight:500, margin:0, color:P.ink }}>
              Live enforcement.
            </h1>
            <div style={{ marginTop:8, color:P.ink3, fontSize:14 }}>
              {account.name} · {PLAN_LABEL} · {account.status}
            </div>
          </div>
          <div style={{ display:'flex', gap:10 }}>
            <Pill color={envHealthy ? P.green : P.amber} dot>{envHealthy ? 'Gateway healthy' : 'Gateway degraded'}</Pill>
            <a href="/docs.html" style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'9px 16px', border:`1px solid ${P.rule}`, borderRadius:4, fontSize:13, color:P.ink2, background:'transparent' }}>
              Docs →
            </a>
          </div>
        </div>
      </section>
    );
  }

  // ───── Stats tiles ────────────────────────────────────────────────
  function StatTile({ label, value, sub, onClick, accent }) {
    return (
      <button onClick={onClick} style={{
        textAlign:'left', cursor: onClick ? 'pointer' : 'default',
        padding:'22px 24px', border:`1px solid ${P.ruleLight}`, borderRadius:8,
        background:P.paper, color:P.ink, fontFamily:'inherit', width:'100%'
      }}>
        <div style={{ fontSize:11, color:P.ink4, letterSpacing:'0.06em', textTransform:'uppercase', fontWeight:600, marginBottom:8 }}>{label}</div>
        <div style={{ fontSize:32, fontWeight:500, letterSpacing:'-0.02em', color: accent || P.ink }}>{value}</div>
        <div style={{ fontSize:11.5, color:P.ink4, marginTop:4, fontFamily:MONO }}>{sub}</div>
      </button>
    );
  }

  function Stats({ usage, limits, onNav, account, apiKey, showToast }) {
    // Per-tile accent: orange ≥80%, red ≥100% (hard cap). max_agents=-1 / evaluations_per_month=-1 mean unlimited.
    const agentPct = (limits.max_agents != null && limits.max_agents > 0)
      ? Math.round(((usage.agents || 0) / limits.max_agents) * 100) : 0;
    const evalPct  = (limits.evaluations_per_month != null && limits.evaluations_per_month > 0)
      ? Math.round(((usage.evaluations_this_month || 0) / limits.evaluations_per_month) * 100) : 0;
    const agentColor = agentPct >= 100 ? P.red : agentPct >= 80 ? P.amber : null;
    const evalColor  = evalPct  >= 100 ? P.red : evalPct  >= 80 ? P.amber : null;

    return (
      <section style={{ padding:'24px 40px 12px' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:16 }}>
          <StatTile label="Agents"             value={fmtNum(usage.agents)}                 sub={limits.max_agents === -1 ? 'unlimited' : (usage.agents || 0) + ' of ' + limits.max_agents + ' used'}            accent={agentColor} onClick={() => onNav('agents')}/>
          <StatTile label="Delegations"        value={fmtNum(usage.delegations)}            sub="active"                                                                                                       onClick={() => onNav('delegations')}/>
          <StatTile label="Evals this month"   value={fmtNum(usage.evaluations_this_month)} sub={limits.evaluations_per_month === -1 ? 'unlimited' : (usage.evaluations_this_month || 0) + ' of ' + limits.evaluations_per_month}  accent={evalColor}  onClick={() => onNav('live')}/>
          <StatTile label="Signed receipts"    value={fmtNum(usage.receipts)}               sub="verifiable"                                                                                                   onClick={() => onNav('receipts')}/>
        </div>
        {account && account.plan === 'free' ? <FreePlanBanner usage={usage} limits={limits} apiKey={apiKey} showToast={showToast} /> : null}
      </section>
    );
  }

  // Free-plan upgrade banner. Shows different copy when limits are near/at hit.
  // Clicking "Upgrade to Pro" calls /api/v1/billing/checkout and redirects to Stripe.
  function FreePlanBanner({ usage, limits, apiKey, showToast }) {
    const [busy, setBusy] = React.useState(false);
    const agentPct = (limits.max_agents != null && limits.max_agents > 0)
      ? ((usage.agents || 0) / limits.max_agents) : 0;
    const evalPct  = (limits.evaluations_per_month != null && limits.evaluations_per_month > 0)
      ? ((usage.evaluations_this_month || 0) / limits.evaluations_per_month) : 0;
    const atLimit  = agentPct >= 1 || evalPct >= 1;
    const nearLimit = !atLimit && (agentPct >= 0.8 || evalPct >= 0.8);

    const tone = atLimit ? 'red' : nearLimit ? 'amber' : 'neutral';
    const accent = tone === 'red' ? P.red : tone === 'amber' ? P.amber : P.ink3;
    const bg     = tone === 'red' ? P.red + '12' : tone === 'amber' ? P.amber + '12' : P.surface;
    const headline = atLimit
      ? 'You have hit a Free-plan limit. New requests will be rejected until you upgrade.'
      : nearLimit
      ? 'You are approaching your Free-plan limit.'
      : 'You are on the Free plan. 3 agents and 1,000 evaluations per month.';
    const cta = atLimit ? 'Upgrade now →' : nearLimit ? 'Upgrade to Pro →' : 'See Pro & Enterprise →';

    const onUpgrade = () => {
      setBusy(true);
      fetch(GATEWAY + '/api/v1/billing/checkout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan: 'pro' }),
      }).then(r => r.json().then(j => ({ s: r.status, b: j })))
        .then(res => {
          setBusy(false);
          if (res.s === 200 && res.b.url) {
            window.location.href = res.b.url;
          } else if (res.s === 503) {
            showToast('Billing not configured yet. Email signal@aeoess.com to upgrade.', 'error');
          } else {
            showToast('Could not start checkout: ' + ((res.b && res.b.error) || 'unknown'), 'error');
          }
        }).catch(() => { setBusy(false); showToast('Network error reaching billing.', 'error'); });
    };

    return (
      <div style={{ maxWidth:1280, margin:'14px auto 0', padding:'14px 18px',
        background: bg, border: `1px solid ${accent}`, borderRadius:6,
        display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <span style={{ width:8, height:8, borderRadius:'50%', background:accent, flexShrink:0 }}/>
          <div>
            <div style={{ fontSize:13.5, color: accent, fontWeight:600 }}>{headline}</div>
            <div style={{ fontSize:12, color:P.ink3, marginTop:2 }}>
              {atLimit
                ? 'Pro is $299/month: 25 agents, 50,000 evaluations, 1-year audit retention.'
                : 'Hard limits enforced by the gateway. Pro removes them: 25 agents, 50,000 evaluations, 1-year retention.'}
            </div>
          </div>
        </div>
        <button onClick={onUpgrade} disabled={busy}
          style={{ padding:'9px 16px', fontSize:13, fontWeight:600, borderRadius:4,
            background: tone === 'red' ? accent : 'transparent',
            color: tone === 'red' ? '#fff' : accent,
            border: `1px solid ${accent}`,
            cursor: busy ? 'wait' : 'pointer' }}>
          {busy ? 'Starting checkout…' : cta}
        </button>
      </div>
    );
  }

  // ───── Live: decisions + environment ──────────────────────────────
  function LiveSection({ apiKey, envState }) {
    const [rows, setRows] = React.useState([]);
    const [status, setStatus] = React.useState('loading');

    React.useEffect(() => {
      let cancelled = false;
      const tick = () => {
        if (document.visibilityState !== 'visible') return; // Pause when tab hidden
        api('/api/v1/decisions/recent?limit=20', apiKey).then(res => {
          if (cancelled) return;
          if (res.status === 200) {
            const d = res.body.decisions || [];
            setRows(d);
            setStatus(d.length > 0 ? 'live' : 'idle');
          } else { setStatus('error'); }
        }).catch(() => { if (!cancelled) setStatus('error'); });
      };
      tick();
      const t = setInterval(tick, 10000);
      return () => { cancelled = true; clearInterval(t); };
    }, [apiKey]);

    return (
      <section id="live" style={{ padding:'12px 40px 16px' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', display:'grid', gridTemplateColumns:'2fr 1fr', gap:16 }}>
          {/* Decisions */}
          <div style={{ background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, overflow:'hidden' }}>
            <div style={{ padding:'14px 18px', borderBottom:`1px solid ${P.ruleLight}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <div style={{ fontSize:13, fontWeight:600, color:P.ink }}>Live decisions</div>
              <div style={{ fontSize:11, color: status === 'live' ? P.green : P.ink5, fontFamily:MONO, letterSpacing:'0.08em', textTransform:'uppercase' }}>
                {status === 'live'  ? 'live · last 20'
                : status === 'idle' ? 'no evaluations yet'
                : status === 'error'? 'feed error' : 'loading…'}
              </div>
            </div>
            {rows.length === 0 ? (
              <div style={{ padding:'48px 18px', textAlign:'center', color:P.ink4, fontSize:13 }}>
                {status === 'idle'
                  ? 'No policy evaluations recorded yet. They appear here as your agents call /api/v1/evaluate.'
                  : status === 'error'
                  ? 'Could not load the decisions feed. Try again in a moment.'
                  : 'Loading recent decisions…'}
              </div>
            ) : (
              <table style={{ width:'100%', borderCollapse:'collapse', fontFamily:MONO, fontSize:12.5 }}>
                <tbody>
                  {rows.map((r, i) => {
                    const allow = r.decision === 'permit' || r.decision === 'allow';
                    const c = allow ? P.green : P.red;
                    return (
                      <tr key={r.id || i}>
                        <td style={{ padding:'10px 18px', color:P.ink5, borderTop: i ? `1px solid ${P.ruleLight}` : 'none', whiteSpace:'nowrap' }}>{fmtTime(r.ts)}</td>
                        <td style={{ padding:'10px 12px', borderTop: i ? `1px solid ${P.ruleLight}` : 'none' }}>
                          <span style={{ display:'inline-block', padding:'2px 8px', borderRadius:3, fontSize:11, background: c + '1f', color: c, fontWeight:600 }}>
                            {String(r.decision || '').toUpperCase()}
                          </span>
                        </td>
                        <td style={{ padding:'10px 12px', color:P.ink4, borderTop: i ? `1px solid ${P.ruleLight}` : 'none' }}>{fmtMs(r.duration_ms)}</td>
                        <td style={{ padding:'10px 12px', color:P.ink2, borderTop: i ? `1px solid ${P.ruleLight}` : 'none' }}>{truncMid(r.agent_id || '', 10, 4)}</td>
                        <td style={{ padding:'10px 12px', color:P.ink3, borderTop: i ? `1px solid ${P.ruleLight}` : 'none' }}>{r.action_type}</td>
                        <td style={{ padding:'10px 18px', color:P.ink2, borderTop: i ? `1px solid ${P.ruleLight}` : 'none', textAlign:'right' }}>{r.scope_required}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>

          {/* Environment + Conformance (stacked sidebar) */}
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <div style={{ background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8 }}>
              <div style={{ padding:'14px 18px', borderBottom:`1px solid ${P.ruleLight}`, fontSize:13, fontWeight:600, color:P.ink }}>Environment</div>
              {[
                { k:'gateway.aeoess.com', v: envState.gateway.v, s: envState.gateway.s },
                { k:'JWKS',               v: envState.jwks.v,    s: envState.jwks.s },
                { k:'Policy bundle',      v: envState.bundle.v,  s: envState.bundle.s },
                { k:'Trust feed',         v: envState.trust.v,   s: envState.trust.s },
              ].map((e, i) => {
                const dot = e.s === 'green' ? P.green : e.s === 'red' ? P.red : P.amber;
                return (
                  <div key={e.k} style={{ padding:'12px 18px', borderTop: i ? `1px solid ${P.ruleLight}` : 'none',
                    display:'grid', gridTemplateColumns:'14px 1fr', gap:10, alignItems:'baseline' }}>
                    <span style={{ width:8, height:8, borderRadius:'50%', background:dot, marginTop:4 }}/>
                    <div>
                      <div style={{ fontSize:13, color:P.ink, fontWeight:500 }}>{e.k}</div>
                      <div style={{ fontFamily:MONO, fontSize:11.5, color:P.ink4, marginTop:2 }}>{e.v}</div>
                    </div>
                  </div>
                );
              })}
            </div>
            <ConformanceCard/>
          </div>
        </div>
      </section>
    );
  }

  // ───── Connect: integration setup tabs ────────────────────────────
  // Key handling: the API key is sensitive. By default we render a MASKED
  // version (prefix + last 4). User must click "Reveal" to see the full
  // key. Copy-button always copies the FULL key regardless of mask state
  // (matches Stripe's convention).
  function maskKey(k) {
    if (!k) return '';
    if (k.length <= 16) return k;
    return k.substr(0, 12) + '…' + k.substr(-4);
  }

      { id:'curl',    label:'curl' },

`{
  "mcpServers": {
    "aeoess": {

      "args": ["-y", "agent-passport-mcp"],
      "env": {
        "APS_API_KEY": "${displayKey}",
        "APS_GATEWAY_URL": "https://gateway.aeoess.com"
      }
    }
  }
}`;
    const cursorJSON = claudeJSON; // Cursor uses the same MCP schema

`// npm install agent-passport-system

const gw = new Gateway({
  apiKey: '${displayKey}',

});

await gw.registerAgent({ agent_id: 'my-agent', public_key: '<ed25519 pub>' });
const decision = await gw.evaluate({
  agent_id: 'my-agent',
  action_type: 'commerce.checkout',
  scope_required: 'commerce.purchase',
});
console.log(decision.verdict, decision.reason);`;

`# pip install agent-passport-system
from agent_passport_system import Gateway

gw = Gateway(

)

gw.register_agent(agent_id="my-agent", public_key="<ed25519 pub>")
decision = gw.evaluate(
    agent_id="my-agent",

)
print(decision.verdict, decision.reason)`;
    const curlSnippet =
`# Test your authentication
curl -H "Authorization: Bearer ${displayKey}" \\

curl -X POST -H "Authorization: Bearer ${displayKey}" \\

# Evaluate a policy
curl -X POST -H "Authorization: Bearer ${displayKey}" \\

    const body = (() => {
      if (tab === 'claude') {
        return (
          <div>
            <Hint>
              Paste into <span className="mono">{paths.claude.path}</span> on {paths.claude.os}, then restart Claude Desktop.

        );

        return (
          <div>
            <Hint>

      if (tab === 'py')   return (<div><Hint>Python 3.9+. Install <span className="mono">agent-passport-system</span> from PyPI.</Hint><Codeblock code={pySnippet} apiKey={apiKey} reveal={reveal}/></div>);
      if (tab === 'curl') return (<div><Hint>Any shell. The Authorization header is your bearer.</Hint><Codeblock code={curlSnippet} apiKey={apiKey} reveal={reveal}/></div>);

    return (

  // ───── Agents section ────────────────────────────────────────────
  function AgentsSection({ apiKey, refreshTrigger, showToast }) {

    React.useEffect(() => {

        if (res.status === 200) {
          setRows(res.body.agents || []);
          setTotal(res.body.total || 0);
          setStatus('ok');
        } else { setStatus('error'); }
      }).catch(() => { if (!cancelled) setStatus('error'); });
      return () => { cancelled = true; };
    }, [apiKey, refreshTrigger]);

    const filtered = search
      ? rows.filter(a => (a.agent_id + ' ' + (a.name || '')).toLowerCase().includes(search.toLowerCase()))
      : rows;

    return (
      <section id="agents" style={{ padding:'16px 40px' }}>

          ) : (
            <table style={{ width:'100%', borderCollapse:'collapse', fontFamily:MONO, fontSize:12.5 }}>

        </div>

            </table>

        </div>

  // ───── API keys section ───────────────────────────────────────────
  function KeysSection({ apiKey, account, onRotated, showToast }) {
    const [busy, setBusy] = React.useState(false);
    const onRotate = () => {
      if (!confirm('Issue a new API key alongside the current one? Your current key keeps working until you revoke it explicitly.')) return;
      setBusy(true);
      api('/api/v1/account/rotate-key', apiKey, { method: 'POST' }).then(res => {
        setBusy(false);
        if (res.status === 200 && res.body.api_key) {
          try { localStorage.setItem(KEY_STORAGE, res.body.api_key); } catch(e) {}
          showToast('New key issued. Old keys remain active until revoked.', 'success');
          onRotated(res.body.api_key);
        } else {
          showToast('Rotate failed: ' + (res.body.error || 'unknown'), 'error');
        }
      }).catch(() => { setBusy(false); showToast('Rotate failed: network error', 'error'); });
    };

    return (
      <section id="keys" style={{ padding:'16px 40px' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, padding:'22px 24px 18px' }}>
          <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', flexWrap:'wrap', gap:12, marginBottom:14 }}>
            <div>
              <div style={{ fontSize:14, fontWeight:600, color:P.ink }}>API keys</div>
              <div style={{ fontSize:12.5, color:P.ink4, marginTop:4 }}>Bearer tokens for every gateway call. Treat like passwords; rotate if exposed.</div>
            </div>
            <button onClick={onRotate} disabled={busy}
              style={{ padding:'8px 14px', border:`1px solid ${P.rule}`, borderRadius:4, background:'transparent', color:P.ink2, fontSize:12.5, cursor: busy ? 'wait' : 'pointer' }}>
              {busy ? 'Rotating…' : 'Issue new key'}
            </button>
          </div>
          <table style={{ width:'100%', borderCollapse:'collapse', fontFamily:MONO, fontSize:12.5 }}>
            <thead>
              <tr style={{ color:P.ink4, fontSize:10.5, letterSpacing:'0.06em', textTransform:'uppercase' }}>
                <th style={{ textAlign:'left',  padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Key</th>
                <th style={{ textAlign:'left',  padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Name</th>
                <th style={{ textAlign:'left',  padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Created</th>
                <th style={{ textAlign:'left',  padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Last used</th>
                <th style={{ textAlign:'right', padding:'8px 0', fontWeight:600, borderBottom:`1px solid ${P.ruleLight}` }}>Status</th>
              </tr>
            </thead>
            <tbody>
              {(account.api_keys || []).map((k, i) => (
                <tr key={k.prefix + i}>
                  <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.ink5 : P.ink }}>{k.prefix}…</td>
                  <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.ink5 : P.ink2 }}>{k.name}</td>
                  <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.ink5 : P.ink3 }}>{fmtRel(k.created_at)}</td>
                  <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.ink5 : P.ink3 }}>{fmtRel(k.last_used_at)}</td>
                  <td style={{ padding:'12px 0', borderBottom:`1px solid ${P.ruleLight}`, color: k.revoked_at ? P.red : P.green, fontSize:11.5, textAlign:'right' }}>
                    {k.revoked_at ? 'revoked' : 'active'}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
    );
  }

  // ───── Danger zone — cascade revoke with type-to-confirm ─────────
  function CascadeRevokeModal({ apiKey, onClose, onDone, showToast }) {
    const [agents, setAgents] = React.useState([]);
    const [search, setSearch] = React.useState('');
    const [picked, setPicked] = React.useState(null);
    const [confirmText, setConfirmText] = React.useState('');
    const [reason, setReason] = React.useState('');
    const [busy, setBusy] = React.useState(false);
    const [loading, setLoading] = React.useState(true);

    React.useEffect(() => {
      api('/api/v1/agents?limit=100', apiKey).then(res => {
        setLoading(false);
        if (res.status === 200) setAgents(res.body.agents || []);
      }).catch(() => setLoading(false));
    }, [apiKey]);

    const filtered = search
      ? agents.filter(a => (a.agent_id + ' ' + (a.name || '')).toLowerCase().includes(search.toLowerCase()))
      : agents;

    const canSubmit = picked && confirmText.trim() === picked.agent_id && !busy;

    const doRevoke = () => {
      if (!canSubmit) return;
      setBusy(true);
      api('/api/v1/revoke', apiKey, {
        method: 'POST',
        body: JSON.stringify({ agent_id: picked.agent_id, reason: reason.trim() || 'cascade revoke from dashboard' }),
      }).then(res => {
        setBusy(false);
        if (res.status >= 200 && res.status < 300) {
          showToast('Cascade revoke applied to ' + picked.agent_id + '. Downstream delegations invalidated.', 'success');
          onDone();
        } else {
          showToast('Revoke failed: ' + (res.body && res.body.error ? res.body.error : 'HTTP ' + res.status), 'error');
        }
      }).catch(() => { setBusy(false); showToast('Revoke failed: network error', 'error'); });
    };

    return (
      <div role="dialog" aria-modal="true" style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:50, display:'flex', alignItems:'center', justifyContent:'center', padding:'40px 20px' }}>
        <div style={{ background:P.paper, border:`1px solid ${P.rule}`, borderRadius:10, width:'100%', maxWidth:640, maxHeight:'80vh', display:'flex', flexDirection:'column' }}>
          <div style={{ padding:'20px 24px', borderBottom:`1px solid ${P.ruleLight}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <div>
              <div style={{ fontSize:15, fontWeight:600, color:P.ink }}>Cascade revoke</div>
              <div style={{ fontSize:12.5, color:P.ink4, marginTop:2 }}>Revokes an agent <em>and</em> every delegation whose parent chain includes it. Irreversible.</div>
            </div>
            <button onClick={onClose} aria-label="Close" style={{ background:'transparent', border:0, color:P.ink3, cursor:'pointer', fontSize:18 }}>×</button>
          </div>
          <div style={{ padding:'18px 24px', overflow:'auto', flex:1 }}>
            {!picked ? (
              <div>
                <input type="text" placeholder="search agent id or name…" value={search} onChange={e => setSearch(e.target.value)}
                  style={{ width:'100%', padding:'10px 14px', fontSize:13, color:P.ink, border:`1px solid ${P.rule}`, borderRadius:4, background:P.bg, fontFamily:MONO, marginBottom:12 }}/>
                <div style={{ border:`1px solid ${P.ruleLight}`, borderRadius:6, overflow:'hidden', maxHeight:320, overflowY:'auto' }}>
                  {loading ? (
                    <div style={{ padding:'24px 18px', textAlign:'center', color:P.ink4, fontSize:13 }}>Loading agents…</div>
                  ) : filtered.length === 0 ? (
                    <div style={{ padding:'24px 18px', textAlign:'center', color:P.ink4, fontSize:13 }}>{agents.length === 0 ? 'No agents to revoke.' : 'No matches.'}</div>
                  ) : filtered.map((a, i) => (
                    <button key={a.agent_id} onClick={() => setPicked(a)} disabled={a.status !== 'active'}
                      style={{ width:'100%', textAlign:'left', padding:'10px 14px',
                        background: 'transparent', border:0, borderTop: i ? `1px solid ${P.ruleLight}` : 'none',
                        color: a.status === 'active' ? P.ink2 : P.ink5, cursor: a.status === 'active' ? 'pointer' : 'not-allowed', fontFamily:MONO, fontSize:12.5 }}>
                      <div>{a.agent_id}</div>
                      <div style={{ color:P.ink4, fontSize:11, marginTop:2 }}>{a.name || '—'} · {a.status}</div>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div>
                <div style={{ padding:'14px 16px', border:`1px solid ${P.red}`, background: P.red + '0f', borderRadius:6, marginBottom:16 }}>
                  <div style={{ fontSize:13, color:P.red, fontWeight:600, marginBottom:6 }}>You are about to cascade-revoke:</div>
                  <div style={{ fontFamily:MONO, fontSize:13, color:P.ink }}>{picked.agent_id}</div>
                  <div style={{ fontSize:12, color:P.ink4, marginTop:6 }}>
                    {picked.name || '—'} · all downstream delegations under this agent will immediately stop authorising actions.
                  </div>
                </div>
                <label style={{ display:'block', fontSize:12, color:P.ink4, marginBottom:6, fontWeight:500 }}>Reason (recorded in audit log)</label>
                <input type="text" value={reason} onChange={e => setReason(e.target.value)} placeholder="e.g. compromise suspected"
                  style={{ width:'100%', padding:'10px 14px', fontSize:13, color:P.ink, border:`1px solid ${P.rule}`, borderRadius:4, background:P.bg, marginBottom:14 }}/>
                <label style={{ display:'block', fontSize:12, color:P.ink4, marginBottom:6, fontWeight:500 }}>
                  Type the agent id to confirm:&nbsp;
                  <span style={{ fontFamily:MONO, color:P.ink3 }}>{picked.agent_id}</span>
                </label>
                <input type="text" value={confirmText} onChange={e => setConfirmText(e.target.value)} placeholder={picked.agent_id} autoFocus
                  style={{ width:'100%', padding:'10px 14px', fontSize:13, color:P.ink, border:`1px solid ${confirmText && confirmText !== picked.agent_id ? P.red : P.rule}`, borderRadius:4, background:P.bg, fontFamily:MONO }}/>
                <div style={{ marginTop:6, fontSize:11, color: confirmText === picked.agent_id ? P.green : P.ink5 }}>
                  {confirmText === picked.agent_id ? '✓ confirmation matches' : 'must match exactly to enable revoke'}
                </div>
              </div>
            )}
          </div>
          <div style={{ padding:'14px 24px', borderTop:`1px solid ${P.ruleLight}`, display:'flex', justifyContent:'flex-end', gap:8 }}>
            {picked ? (
              <button onClick={() => { setPicked(null); setConfirmText(''); }}
                style={{ padding:'9px 14px', border:`1px solid ${P.rule}`, borderRadius:4, background:'transparent', color:P.ink2, fontSize:13, cursor:'pointer' }}>
                ← Pick another
              </button>
            ) : null}
            <button onClick={onClose} style={{ padding:'9px 14px', border:`1px solid ${P.rule}`, borderRadius:4, background:'transparent', color:P.ink2, fontSize:13, cursor:'pointer' }}>
              Cancel
            </button>
            {picked ? (
              <button onClick={doRevoke} disabled={!canSubmit}
                style={{ padding:'9px 16px', border:`1px solid ${canSubmit ? P.red : P.rule}`, borderRadius:4,
                  background: canSubmit ? P.red : 'transparent', color: canSubmit ? '#fff' : P.ink5,
                  fontSize:13, fontWeight:600, cursor: canSubmit ? 'pointer' : 'not-allowed' }}>
                {busy ? 'Revoking…' : 'Cascade revoke'}
              </button>
            ) : null}
          </div>
        </div>
      </div>
    );
  }

  function DangerZone({ apiKey, onRevoked, showToast }) {
    const [open, setOpen] = React.useState(false);
    return (
      <section id="danger" style={{ padding:'16px 40px 64px' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', background: P.red + '0a', border:`1px solid ${P.red}33`, borderRadius:8, padding:'22px 24px' }}>
          <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
            <div>
              <div style={{ fontSize:14, fontWeight:600, color:P.red, letterSpacing:'0.04em', textTransform:'uppercase' }}>Danger zone</div>
              <div style={{ fontSize:13, color:P.ink3, marginTop:8, maxWidth:680, lineHeight:1.55 }}>
                Cascade revoke immediately invalidates an agent <em>and</em> every delegation whose chain includes it.
                The action is recorded as an audit event and a signed revocation receipt is emitted to every downstream agent.
                There is no undo.
              </div>
            </div>
            <button onClick={() => setOpen(true)}
              style={{ padding:'9px 16px', border:`1px solid ${P.red}`, background:'transparent', color:P.red, borderRadius:4, fontSize:13, fontWeight:600, cursor:'pointer' }}>
              Issue cascade revoke
            </button>
          </div>
        </div>
        {open ? <CascadeRevokeModal apiKey={apiKey} onClose={() => setOpen(false)} onDone={() => { setOpen(false); onRevoked(); }} showToast={showToast}/> : null}
      </section>
    );
  }

  // ───── Setup checklist (collapses once you've gotten started) ────
  function SetupChecklist({ account }) {
    const usage = account.usage || {};
    const items = [
      { id:'account',  label:'Account created',           done:true },
      { id:'key',      label:'API key issued',            done:(account.api_keys || []).some(k => !k.revoked_at) },
      { id:'runtime',  label:'Connect a runtime (MCP / SDK / curl)', done:false, hint:'See the Connect section below' },
      { id:'agent',    label:'Register your first agent', done:(usage.agents || 0) > 0 },
      { id:'eval',     label:'First policy evaluation',   done:(usage.receipts || 0) > 0 || (usage.evaluations_this_month || 0) > 0 },
    ];
    const allDone = items.every(i => i.done);
    if (allDone) return null;

    return (
      <section style={{ padding:'16px 40px 0' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, padding:'18px 22px' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
            <div>
              <div style={{ fontSize:13, fontWeight:600, color:P.ink }}>Getting started</div>
              <div style={{ fontSize:12, color:P.ink4, marginTop:2 }}>{items.filter(i => i.done).length} of {items.length} complete</div>
            </div>
            <div style={{ display:'flex', gap:6 }}>
              {items.map(i => (
                <span key={i.id} style={{ width:24, height:4, borderRadius:2, background: i.done ? P.green : P.ruleLight }}/>
              ))}
            </div>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:10 }}>
            {items.map(i => (
              <div key={i.id} style={{
                display:'flex', alignItems:'flex-start', gap:10, padding:'10px 12px',
                border:`1px solid ${P.ruleLight}`, borderRadius:6,
                background: i.done ? P.surface : 'transparent',
                opacity: i.done ? 0.7 : 1,
              }}>
                <span style={{ marginTop:2, width:14, height:14, borderRadius:'50%',
                  border: `1px solid ${i.done ? P.green : P.rule}`,
                  background: i.done ? P.green : 'transparent',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:9, color: i.done ? P.bg : P.ink5, fontWeight:700, flexShrink:0
                }}>
                  {i.done ? '✓' : ''}
                </span>
                <div>
                  <div style={{ fontSize:13, color: i.done ? P.ink3 : P.ink, fontWeight:500, textDecoration: i.done ? 'line-through' : 'none' }}>{i.label}</div>
                  {!i.done && i.hint ? <div style={{ fontSize:11.5, color:P.ink4, marginTop:2 }}>{i.hint}</div> : null}
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  }

  // ───── Conformance card (sidebar in Live section) ─────────────────
  function ConformanceCard() {
    const [data, setData] = React.useState(null);
    React.useEffect(() => {
      fetch(GATEWAY + '/api/v1/public/conformance').then(r => r.json()).then(setData).catch(() => {});
    }, []);
    if (!data) {
      return (
        <div style={{ background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, padding:'18px 22px' }}>
          <div style={{ fontSize:13, fontWeight:600, color:P.ink, marginBottom:6 }}>Conformance</div>
          <div style={{ fontSize:12, color:P.ink4 }}>Loading…</div>
        </div>
      );
    }
    const passing = data.passing_vectors;
    const total = data.total_vectors;
    const pct = total > 0 ? Math.round(passing / total * 100) : 0;
    return (
      <div style={{ background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8, padding:'18px 22px' }}>
        <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:10 }}>
          <div style={{ fontSize:13, fontWeight:600, color:P.ink }}>Conformance</div>
          <span style={{ fontSize:11, color: passing === total ? P.green : P.amber, fontFamily:MONO }}>
            {passing}/{total} · {pct}%
          </span>
        </div>
        <div style={{ height:6, background:P.surface, borderRadius:3, overflow:'hidden', marginBottom:12 }}>
          <div style={{ height:'100%', width: pct + '%', background: passing === total ? P.green : P.amber }}/>
        </div>
        {data.categories.map((c, i) => (
          <div key={c.name} style={{ display:'flex', justifyContent:'space-between', padding:'6px 0',
            borderTop: i ? `1px solid ${P.ruleLight}` : 'none', fontSize:11.5 }}>
            <span style={{ color:P.ink3, fontFamily:MONO }}>{c.name}</span>
            <span style={{ color: c.passing === c.total ? P.green : P.amber, fontFamily:MONO }}>{c.passing}/{c.total}</span>
          </div>
        ))}
        <div style={{ marginTop:10, paddingTop:10, borderTop:`1px solid ${P.ruleLight}`, fontSize:11, color:P.ink4, lineHeight:1.5 }}>
          RFC 8785 JCS · Ed25519 · last verified {data.last_verified} · <a href={data.repo} target="_blank" rel="noopener" style={{ color:P.link }}>repo →</a>
        </div>
      </div>
    );
  }

        </div>
      </section>
    );
  }

  // ───── Audit log section ──────────────────────────────────────────
  function AuditSection({ apiKey }) {
    const [rows, setRows] = React.useState([]);
    const [total, setTotal] = React.useState(0);
    const [status, setStatus] = React.useState('loading');
    const [filterVerdict, setFilterVerdict] = React.useState('all');

    const load = React.useCallback(() => {
      setStatus('loading');
      const qs = filterVerdict !== 'all' ? '?verdict=' + filterVerdict + '&limit=50' : '?limit=50';
      api('/api/v1/audit' + qs, apiKey).then(res => {
        if (res.status === 200) {
          setRows(res.body.entries || []);
          setTotal(res.body.total || 0);
          setStatus('ok');
        } else { setStatus('error'); }
      }).catch(() => setStatus('error'));
    }, [apiKey, filterVerdict]);

    React.useEffect(() => { load(); }, [load]);

    const downloadCSV = () => {
      const cols = ['created_at', 'agent_id', 'action_type', 'scope_required', 'verdict', 'reason', 'duration_ms'];
      const header = cols.join(',');
      const escape = (v) => {
        const s = v == null ? '' : String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const body = rows.map(r => cols.map(c => escape(r[c])).join(',')).join('\n');
      const blob = new Blob([header + '\n' + body], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'aeoess-audit-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    return (
      <section id="audit" style={{ padding:'16px 40px' }}>
        <div style={{ maxWidth:1280, margin:'0 auto', background:P.paper, border:`1px solid ${P.ruleLight}`, borderRadius:8 }}>
          <div style={{ padding:'18px 22px 12px', borderBottom:`1px solid ${P.ruleLight}`, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
            <div>
              <div style={{ fontSize:14, fontWeight:600, color:P.ink }}>Audit log</div>
              <div style={{ fontSize:12.5, color:P.ink4, marginTop:4 }}>
                Every policy evaluation, with the signed receipt where one was emitted. {status === 'loading' ? 'loading…' : 'Showing ' + rows.length + ' of ' + total + '.'}
              </div>
            </div>
            <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
              <select value={filterVerdict} onChange={e => setFilterVerdict(e.target.value)}
                style={{ padding:'7px 10px', fontSize:12.5, color:P.ink, border:`1px solid ${P.rule}`, borderRadius:4, background:P.bg, fontFamily:'inherit' }}>
                <option value="all">All decisions</option>
                <option value="permit">Permits only</option>
                <option value="deny">Denies only</option>
              </select>
              <button onClick={downloadCSV} disabled={rows.length === 0}
                style={{ padding:'7px 12px', fontSize:12.5, color:P.ink2, border:`1px solid ${P.rule}`, borderRadius:4, background:'transparent', cursor: rows.length ? 'pointer' : 'not-allowed' }}>
                Download CSV
              </button>
            </div>
          </div>
          {rows.length === 0 ? (
            <div style={{ padding:'48px 18px', textAlign:'center', color:P.ink4, fontSize:13 }}>
              {status === 'loading' ? 'Loading audit log…'
              : status === 'error' ? 'Could not load audit log.'
              : 'No matching entries.'}
            </div>
          ) : (
            <table style={{ width:'100%', borderCollapse:'collapse', fontFamily:MONO, fontSize:12 }}>
              <thead>
                <tr style={{ color:P.ink4, fontSize:10.5, letterSpacing:'0.06em', textTransform:'uppercase' }}>
                  <th style={{ textAlign:'left', padding:'10px 22px', fontWeight:600 }}>When</th>
                  <th style={{ textAlign:'left', padding:'10px 12px', fontWeight:600 }}>Verdict</th>
                  <th style={{ textAlign:'left', padding:'10px 12px', fontWeight:600 }}>Agent</th>
                  <th style={{ textAlign:'left', padding:'10px 12px', fontWeight:600 }}>Action</th>
                  <th style={{ textAlign:'left', padding:'10px 12px', fontWeight:600 }}>Scope</th>
                  <th style={{ textAlign:'left', padding:'10px 12px', fontWeight:600 }}>Reason</th>
                  <th style={{ textAlign:'left', padding:'10px 22px', fontWeight:600 }}>Receipt</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => {
                  const allow = r.verdict === 'permit' || r.verdict === 'allow';
                  const c = allow ? P.green : P.red;
                  return (
                    <tr key={r.id || i}>
                      <td style={{ padding:'10px 22px', color:P.ink5, borderTop:`1px solid ${P.ruleLight}` }}>{fmtRel(r.created_at)}</td>
                      <td style={{ padding:'10px 12px', borderTop:`1px solid ${P.ruleLight}` }}>
                        <span style={{ display:'inline-block', padding:'2px 8px', borderRadius:3, fontSize:11, background: c+'1f', color: c, fontWeight:600 }}>
                          {String(r.verdict || '').toUpperCase()}
                        </span>
                      </td>
                      <td style={{ padding:'10px 12px', color:P.ink2, borderTop:`1px solid ${P.ruleLight}` }}>{truncMid(r.agent_id || '', 10, 4)}</td>
                      <td style={{ padding:'10px 12px', color:P.ink3, borderTop:`1px solid ${P.ruleLight}` }}>{r.action_type}</td>
                      <td style={{ padding:'10px 12px', color:P.ink3, borderTop:`1px solid ${P.ruleLight}` }}>{r.scope_required}</td>
                      <td style={{ padding:'10px 12px', color:P.ink4, borderTop:`1px solid ${P.ruleLight}` }}>{r.reason || '—'}</td>
                      <td style={{ padding:'10px 22px', color: r.signature ? P.green : P.ink5, borderTop:`1px solid ${P.ruleLight}` }}>
                        {r.signature ? '✓ signed' : '—'}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      </section>
    );
  }

  // ───── Dashboard root ─────────────────────────────────────────────
  function Dashboard({ apiKey, onSignOut }) {
    const [account, setAccount] = React.useState(null);
    const [envState, setEnvState] = React.useState({
      gateway: { v:'loading…', s:'amber' },
      jwks:    { v:'loading…', s:'amber' },
      bundle:  { v:'co-deployed with gateway', s:'green' },
      trust:   { v:'multi-issuer feed live',   s:'green' },
    });
    const [active, setActive] = React.useState('overview');
    const [toast, setToast] = React.useState(null);
    const [agentsRefresh, setAgentsRefresh] = React.useState(0);

    const showToast = (msg, kind) => { setToast({ msg, kind: kind || 'info' }); setTimeout(() => setToast(null), 4000); };

    // Load account + env
    React.useEffect(() => {
      let cancelled = false;
      const loadAccount = () => api('/api/v1/account', apiKey).then(res => {
        if (cancelled) return;
        if (res.status === 401) { clearKey(); onSignOut('Your API key is no longer valid.'); return; }
        if (res.status === 200) setAccount(res.body);
      });
      const loadEnv = () => {
        fetch(GATEWAY + '/healthz').then(r => r.json()).then(d => {
          if (!cancelled) setEnvState(s => ({ ...s, gateway: { v: 'v' + (d.version || '?') + ' · us-west', s:'green' } }));
        }).catch(() => { if (!cancelled) setEnvState(s => ({ ...s, gateway: { v:'unreachable', s:'red' } })); });
        fetch(GATEWAY + '/.well-known/jwks.json').then(r => r.ok ? r.json() : null).then(d => {
          if (cancelled) return;
          if (d && d.keys && d.keys.length > 0) {
            setEnvState(s => ({ ...s, jwks: { v: 'kid: ' + (d.keys[0].kid || 'unknown'), s:'green' } }));
          } else { setEnvState(s => ({ ...s, jwks: { v: 'no keys advertised', s:'amber' } })); }
        }).catch(() => { if (!cancelled) setEnvState(s => ({ ...s, jwks: { v:'unreachable', s:'red' } })); });
      };
      loadAccount(); loadEnv();
      const t = setInterval(loadAccount, 30000);
      return () => { cancelled = true; clearInterval(t); };
    }, [apiKey]);

    const onNav = (id) => {
      setActive(id);
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 110, behavior: 'smooth' });
    };

    const onRotated = (newKey) => {
      // Reload silently with the new key surfaced in api_keys list on next /account fetch.
      api('/api/v1/account', apiKey).then(res => { if (res.status === 200) setAccount(res.body); });
      showToast('Save your new key: ' + maskKey(newKey) + ' — visible once in Connect section.', 'success');
    };

    if (!account) {
      return (
        <div>
          <Header tenant={null} onSignOut={() => onSignOut()} active={active} onNav={onNav}/>
          <div className="loading">Loading your tenant…</div>
        </div>
      );
    }

    const usage = account.usage || {};
    const limits = account.limits || {};
    const envHealthy = envState.gateway.s === 'green' && envState.jwks.s !== 'red';

    return (
      <div style={{ background:P.bg, color:P.ink, minHeight:'100%' }}>
        <Header tenant={account} onSignOut={onSignOut} active={active} onNav={onNav}/>
        <Hero account={account} envHealthy={envHealthy}/>
        <SetupChecklist account={account}/>
        <Stats usage={usage} limits={limits} onNav={onNav} account={account} apiKey={apiKey} showToast={showToast}/>
        <LiveSection apiKey={apiKey} envState={envState}/>
        <ConnectTabs apiKey={apiKey} showToast={showToast}/>
        <IntegrationsSection apiKey={apiKey}/>
        <ComplianceSection apiKey={apiKey}/>
        <AgentsSection apiKey={apiKey} refreshTrigger={agentsRefresh} showToast={showToast}/>
        <DelegationsSection apiKey={apiKey}/>
        <ReceiptsSection apiKey={apiKey}/>
        <AuditSection apiKey={apiKey}/>
        <KeysSection apiKey={apiKey} account={account} onRotated={onRotated} showToast={showToast}/>
        <DangerZone apiKey={apiKey} onRevoked={() => setAgentsRefresh(x => x + 1)} showToast={showToast}/>

        <footer style={{ borderTop:`1px solid ${P.ruleLight}`, background:P.paper, color:P.ink4, fontSize:12, padding:'24px 40px', textAlign:'center' }}>
          © 2026 AEOESS · <a href="mailto:signal@aeoess.com" style={{ color:P.ink3 }}>signal@aeoess.com</a> · <a href="/portal.html" style={{ color:P.ink3 }}>Portal</a>
        </footer>

        <Toast toast={toast}/>
      </div>
    );
  }

  function App() {
    const [ctx, setCtx] = React.useState(() => readWelcomeKey());
    const [signinErr, setSigninErr] = React.useState(null);
    const onSignOut = (msg) => { clearKey(); setSigninErr(msg || null); setCtx(null); };
    if (!ctx) return <SignIn initialError={signinErr} onKey={k => setCtx({ key: k, fresh: false })}/>;
    return <Dashboard apiKey={ctx.key} onSignOut={onSignOut}/>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
