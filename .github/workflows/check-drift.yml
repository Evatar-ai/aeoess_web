name: Drift check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for forbidden patterns
        run: |
          set -e

          PATTERNS=(
            'aeoess-private'
            '/Users/tima'
            'MODEL-CITIZEN-CANON'
            'MODEL_CITIZEN_CANON'
            'THE-SYNTHESIS'
            'THE_SYNTHESIS'
            'ERIK-NEWTON'
            'ERIK_NEWTON'
            'OPEN-COMMITMENTS'
            'OPEN_COMMITMENTS'
            'CC-PROMPT-TEMPLATES'
            'CC_PROMPT_TEMPLATES'
            'DAILY-UPDATE-RHYTHM'
            'DAILY_UPDATE_RHYTHM'
            'MUTUAL-MODE'
            'MUTUAL_MODE'
            'canary watch'
            'UPDATE-PROPAGATION-SPEC'
            'CONSILIUM-FORENSIC'
            'CONSILIUM-BRIEFING'
            'ROME-COMPLETE'
          )

          # Files we deliberately allow these patterns in: the workflow itself,
          # and the gitignore block listing the same patterns to keep files out.
          # Both exist in this repo and both necessarily enumerate the patterns.
          # Nothing else is exempt — an exclusion for a file that does not exist
          # only creates a hole for whatever later takes that name.
          EXCLUDE_PATHS='(\.github/workflows/check-drift\.yml|\.gitignore)'

          # Shape-only regex patterns for value-style infrastructure leaks.
          # Literal values (specific UUIDs, credentials, etc.) intentionally
          # never appear here so the workflow file does not become a new
          # disclosure surface. Literal values live in the private
          # ~/aeoess-private/scripts/check-drift.sh.
          REGEX_PATTERNS=(
            'tunnel[[:space:]]+id[[:space:]]+[0-9a-f-]{36}'
            '/Users/clawrot\b'
            '\+1[0-9]{10}\b'
          )

          # Tracked files, NUL-delimited end to end so a path containing spaces
          # cannot word-split into two non-existent paths and silently go
          # unscanned. -r keeps grep from reading stdin when the list is empty.
          scan_targets() {
            git ls-files -z | grep -zv -E "$EXCLUDE_PATHS"
          }

          violations=0
          for pat in "${PATTERNS[@]}"; do
            # Case-insensitive: this catches accidental inclusion, and an
            # accident does not preserve the casing of the original token.
            hits=$(scan_targets | xargs -0 -r grep -l -i -F -- "$pat" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::error::Forbidden pattern '$pat' found in:"
              echo "$hits" | sed 's/^/  /'
              violations=$((violations + 1))
            fi

            # Also check filenames themselves
            file_hits=$(git ls-files | grep -i -F -- "$pat" || true)
            if [ -n "$file_hits" ]; then
              echo "::error::Forbidden pattern '$pat' in filename(s):"
              echo "$file_hits" | sed 's/^/  /'
              violations=$((violations + 1))
            fi
          done

          # Shape regexes stay case-sensitive on purpose: they encode literal
          # character classes (lowercase hex in the tunnel id) that -i would
          # widen beyond the shape they are meant to describe.
          for re in "${REGEX_PATTERNS[@]}"; do
            hits=$(scan_targets | xargs -0 -r grep -l -E -- "$re" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::error::Forbidden regex pattern '$re' found in:"
              echo "$hits" | sed 's/^/  /'
              violations=$((violations + 1))
            fi
          done

          if [ "$violations" -gt 0 ]; then
            echo ""
            echo "::error::Drift check failed: $violations pattern violation(s)."
            exit 1
          fi

          echo "✓ Drift check passed."
