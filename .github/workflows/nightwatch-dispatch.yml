name: Nightwatch Dispatch
on:
  schedule:
    # 2:00 UTC nightly (6:00 PM PST / 9:00 PM EST)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather repo state
        id: state
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "latest_commit=$(git log -1 --format='%h %s')" >> $GITHUB_OUTPUT
          ISSUES=$(gh issue list --state open --json number | jq length)
          echo "open_issues=$ISSUES" >> $GITHUB_OUTPUT
          PRS=$(gh pr list --state open --json number | jq length)
          echo "open_prs=$PRS" >> $GITHUB_OUTPUT
          LAST=$(gh issue list --label nightwatch --state closed --limit 1 --json createdAt --jq '.[0].createdAt // "never"')
          echo "last_nightwatch=$LAST" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing dispatch today
        id: check
        run: |
          TODAY="${{ steps.state.outputs.date }}"
          EXISTS=$(gh issue list --label nightwatch --state open --json title --jq "[.[] | select(.title | contains(\"$TODAY\"))] | length")
          echo "already_dispatched=$EXISTS" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dispatch issue
        if: steps.check.outputs.already_dispatched == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.state.outputs.date }}';
            const latestCommit = `${{ steps.state.outputs.latest_commit }}`;
            const openIssues = '${{ steps.state.outputs.open_issues }}';
            const openPRs = '${{ steps.state.outputs.open_prs }}';
            const lastNightwatch = '${{ steps.state.outputs.last_nightwatch }}';

            const body = [
              `## Nightwatch Dispatch: ${date}`,
              ``,
              `**Automated nightly scan request for the AEOESS codebase and ecosystem.**`,
              ``,
              `### Current State Snapshot`,
              `- **Latest commit:** \`${latestCommit}\``,
              `- **Open issues:** ${openIssues}`,
              `- **Open PRs:** ${openPRs}`,
              `- **Last nightwatch:** ${lastNightwatch}`,
              ``,
              `### Scan Assignments`,
              ``,
              `**Scanner: nik-prime** (\`agent-nik-prime-mmby1o31\`)`,
              `Post your scan report as a signed Agora message using the \`agora-post\` issue template. Tag topic: \`nightwatch-scan-${date}\`.`,
              ``,
              `External: trending repos (agent identity, MCP, commerce), competitor activity, npm stats, aeoess repo activity, MCP ecosystem changes.`,
              `Internal: \`npm audit\`, \`npm outdated\`, open issues, test count drift, broken links.`,
              ``,
              `**Analyst: PortalX2** (\`px2-002\`)`,
              `After scan report: deep code analysis, type coverage, test gaps, dead code. Post as Agora message with topic \`nightwatch-analysis-${date}\`.`,
              ``,
              `**Synthesizer: aeoess** (\`aeoess-001\`)`,
              `After both reports: synthesize, create TaskBrief, drive consensus vote.`,
              ``,
              `*Auto-generated by Nightwatch Dispatcher. Spec: NIGHTWATCH-SPEC.md*`
            ].join('\n');

            const issue = await github.rest.issues.create({
              ...context.repo,
              title: `Nightwatch Dispatch: ${date}`,
              body: body,
              labels: ['nightwatch', 'scan-request']
            });
            core.info(`Created dispatch issue #${issue.data.number}`);

      - name: Write dispatch to comms
        if: steps.check.outputs.already_dispatched == '0'
        run: |
          mkdir -p comms/nightwatch
          DATE="${{ steps.state.outputs.date }}"
          cat > comms/nightwatch/dispatch.json << EOF
          {
            "type": "nightwatch-dispatch",
            "date": "$DATE",
            "state": {
              "latest_commit": "${{ steps.state.outputs.latest_commit }}",
              "open_issues": ${{ steps.state.outputs.open_issues }},
              "open_prs": ${{ steps.state.outputs.open_prs }}
            },
            "assignments": {
              "scanner": "agent-nik-prime-mmby1o31",
              "analyst": "px2-002",
              "synthesizer": "aeoess-001"
            },
            "status": "dispatched"
          }
          EOF
          git config user.name "Nightwatch Bot"
          git config user.email "nightwatch@aeoess.com"
          git add comms/nightwatch/dispatch.json
          git commit -m "nightwatch: dispatch $DATE"
          git push
