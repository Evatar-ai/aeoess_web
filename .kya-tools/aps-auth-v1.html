<!-- aps-auth-v1 -->
  <script>
  (function() {
    var GATEWAY = 'https://gateway.aeoess.com';

    // Find the auth column container (left side of the two-column card)
    function getAuthColumn() {
      var input = document.querySelector('input[type="email"]');
      return input ? input.closest('div') : null;
    }

    function statusBar() {
      var existing = document.getElementById('aps-auth-status');
      if (existing) return existing;
      var col = getAuthColumn();
      if (!col) return null;
      var bar = document.createElement('div');
      bar.id = 'aps-auth-status';
      bar.style.cssText = 'margin-top:14px;padding:12px 14px;font-size:13px;line-height:1.5;border-radius:4px;display:none;';
      var btn = Array.from(col.querySelectorAll('button')).find(function(b){ return /Continue with email/.test(b.textContent); });
      if (btn && btn.parentNode) btn.parentNode.insertBefore(bar, btn.nextSibling);
      return bar;
    }

    // C6: setStatus is now safe-by-default (textContent). For call sites
    // that need anchor tags or other markup, use setStatusHTML — and the
    // caller MUST esc() any interpolated untrusted data (res.body.error etc.).
    function _paintStatusBar(kind) {
      var bar = statusBar(); if (!bar) return null;
      var colors = {
        info:    { bg: 'rgb(30,40,55)',  fg: 'rgb(178,206,236)', bd: 'rgb(58,82,116)' },
        success: { bg: 'rgb(28,46,38)',  fg: 'rgb(168,224,184)', bd: 'rgb(58,108,80)' },
        error:   { bg: 'rgb(46,28,32)',  fg: 'rgb(236,168,176)', bd: 'rgb(116,58,68)' }
      };
      var c = colors[kind] || colors.info;
      bar.style.background = c.bg;
      bar.style.color = c.fg;
      bar.style.border = '1px solid ' + c.bd;
      bar.style.display = 'block';
      return bar;
    }
    function setStatus(kind, msg) {
      var bar = _paintStatusBar(kind); if (!bar) return;
      bar.textContent = msg == null ? '' : String(msg);
    }
    function setStatusHTML(kind, html) {
      var bar = _paintStatusBar(kind); if (!bar) return;
      bar.innerHTML = html;
    }

    // Mode: 'signin' (default) or 'signup'. Toggle via the small link
    // injected next to the email button. We default to 'signin' because
    // the legacy entry point header reads "Sign in to your governance
    // dashboard." — signing in is the dominant path.
    var authMode = 'signin';

    function injectPasswordField() {
      var emailInput = document.querySelector('input[type="email"]');
      if (!emailInput) return;
      if (document.getElementById('aps-password')) return; // already injected
      var pwLabel = document.createElement('label');
      pwLabel.style.cssText = 'display:block;font-size:12px;color:rgb(138,138,142);margin-top:12px;margin-bottom:6px;font-weight:500;';
      pwLabel.textContent = 'Password';
      var pwInput = document.createElement('input');
      pwInput.type = 'password';
      pwInput.id = 'aps-password';
      pwInput.autocomplete = 'current-password';
      pwInput.placeholder = '••••••••••';
      pwInput.style.cssText = 'width:100%;padding:10px 14px;font-size:14px;color:rgb(236,236,236);border:1px solid rgb(58,58,62);border-radius:4px;background:rgb(36,36,38);font-family:inherit;box-sizing:border-box;';
      emailInput.insertAdjacentElement('afterend', pwInput);
      emailInput.insertAdjacentElement('afterend', pwLabel);
    }

    function injectModeToggle() {
      var emailBtn = Array.from(document.querySelectorAll('button')).find(function(b) {
        return /^Continue with email/.test((b.textContent || '').trim());
      });
      if (!emailBtn) return;
      if (document.getElementById('aps-mode-row')) return;
      var row = document.createElement('div');
      row.id = 'aps-mode-row';
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:rgb(138,138,142);';
      row.innerHTML =
        '<a id="aps-mode-toggle" href="#" style="color:rgb(124,172,222);text-decoration:none;">Need an account? Sign up</a>' +
        '<a id="aps-forgot-link" href="#" style="color:rgb(138,138,142);text-decoration:none;">Forgot password?</a>';
      emailBtn.insertAdjacentElement('afterend', row);

      document.getElementById('aps-mode-toggle').addEventListener('click', function(e) {
        e.preventDefault();
        authMode = (authMode === 'signin') ? 'signup' : 'signin';
        var toggle = document.getElementById('aps-mode-toggle');
        var pw = document.getElementById('aps-password');
        if (authMode === 'signup') {
          emailBtn.textContent = 'Create account →';
          toggle.textContent = 'Have an account? Sign in';
          if (pw) { pw.autocomplete = 'new-password'; pw.placeholder = 'At least 10 characters'; }
        } else {
          emailBtn.textContent = 'Continue with email →';
          toggle.textContent = 'Need an account? Sign up';
          if (pw) { pw.autocomplete = 'current-password'; pw.placeholder = '••••••••••'; }
        }
      });

      document.getElementById('aps-forgot-link').addEventListener('click', function(e) {
        e.preventDefault();
        handleForgotClick();
      });
    }

    function authEndpoint(path) { return GATEWAY + '/auth/email/' + path; }

    function loginEmail(email, password) {
      setStatus('info', 'Signing you in…');
      return fetch(authEndpoint('login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      }).then(function(r) {
        return r.json().then(function(j) { return { status: r.status, body: j }; });
      });
    }

    function signupWithPassword(email, password) {
      var name = email.split('@')[0].replace(/[^a-z0-9]/gi, ' ').trim() || email;
      setStatus('info', 'Creating your account…');
      return fetch(authEndpoint('signup'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, email: email, password: password })
      }).then(function(r) {
        return r.json().then(function(j) { return { status: r.status, body: j }; });
      });
    }

    function forgotPassword(email) {
      return fetch(authEndpoint('forgot'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      }).then(function(r) {
        return r.json().then(function(j) { return { status: r.status, body: j }; });
      });
    }

    function resetPassword(token, password) {
      return fetch(authEndpoint('reset'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: password })
      }).then(function(r) {
        return r.json().then(function(j) { return { status: r.status, body: j }; });
      });
    }

    function persistAndRedirect(body, successMsg) {
      try {
        localStorage.setItem('aps_api_key', body.api_key);
        localStorage.setItem('aps_tenant_id', body.tenant_id);
      } catch (e) {}
      setStatus('success', successMsg);

      // If they arrived via /pricing → ?next=upgrade_pro, route them straight
      // into Stripe Checkout with the tenant_id properly attached. Otherwise
      // proceed to dashboard.
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next');
      if (next === 'upgrade_pro' || next === 'upgrade_enterprise') {
        var plan = next === 'upgrade_enterprise' ? 'enterprise' : 'pro';
        setStatus('info', 'Account ready. Taking you to Stripe Checkout for ' + plan + '…');
        fetch(GATEWAY + '/api/v1/billing/checkout', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + body.api_key, 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan: plan })
        }).then(function(r) { return r.json().then(function(j) { return { s: r.status, b: j }; }); })
          .then(function(res) {
            if (res.s === 200 && res.b.url) {
              // C5: assert the redirect target is Stripe Checkout (or our own portal-return).
              // The gateway constructs these URLs, but defense-in-depth: never blindly follow
              // an arbitrary URL from JSON into window.location.href.
              if (!/^https:\/\/checkout\.stripe\.com\//.test(res.b.url) &&
                  !/^https:\/\/billing\.stripe\.com\//.test(res.b.url)) {
                setStatus('error', 'Suspicious redirect blocked. Email signal@aeoess.com — this should never happen.');
                return;
              }
              window.location.href = res.b.url; // off to Stripe Checkout
            } else if (res.s === 503) {
              setStatusHTML('error', 'Billing not configured yet. Email <a href="mailto:signal@aeoess.com" style="color:inherit;text-decoration:underline;">signal@aeoess.com</a> to upgrade manually.');
              setTimeout(function() { window.location.href = '/dashboard.html#welcome=' + encodeURIComponent(body.api_key); }, 3000);
            } else {
              setStatus('error', 'Could not start checkout: ' + ((res.b && res.b.error) || 'unknown') + '. Continuing to dashboard.'); // setStatus is textContent-safe; raw interpolation is fine here
              setTimeout(function() { window.location.href = '/dashboard.html#welcome=' + encodeURIComponent(body.api_key); }, 2500);
            }
          }).catch(function() {
            setStatus('error', 'Network error reaching billing. Continuing to dashboard.');
            setTimeout(function() { window.location.href = '/dashboard.html#welcome=' + encodeURIComponent(body.api_key); }, 2500);
          });
        return;
      }

      setTimeout(function() {
        window.location.href = '/dashboard.html#welcome=' + encodeURIComponent(body.api_key);
      }, 1000);
    }

    // Idempotency guard: only auto-start checkout once per page load.
    var _autoCheckoutTriggered = false;

    // Show upgrade-result banners + auto-route already-signed-in users.
    function maybeShowUpgradeBanner() {
      try {
        var params = new URLSearchParams(window.location.search);
        var upgrade = params.get('upgrade');
        var plan = params.get('plan') || '';
        var next = params.get('next');

        if (upgrade === 'success') {
          setStatus('success', 'Payment received. Your ' + (plan || 'paid') + ' plan is active. Redirecting to your dashboard…');
          try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
          setTimeout(function() { window.location.href = '/dashboard.html'; }, 1500);
          return;
        }
        if (upgrade === 'cancelled') {
          setStatusHTML('info', 'Checkout cancelled. You are still on the Free plan. Try again any time from <a href="/pricing.html" style="color:inherit;text-decoration:underline;">pricing</a>.');
          try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
          return;
        }

        if (next === 'upgrade_pro' || next === 'upgrade_enterprise') {
          var planLabel = next === 'upgrade_enterprise' ? 'Enterprise' : 'Pro';
          var existingKey = null;
          try { existingKey = localStorage.getItem('aps_api_key'); } catch(e) {}

          if (existingKey && !_autoCheckoutTriggered) {
            // Already signed in — skip the form, go straight to checkout.
            _autoCheckoutTriggered = true;
            setStatus('info', 'You are signed in. Starting ' + planLabel + ' checkout…');
            fetch(GATEWAY + '/api/v1/billing/checkout', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + existingKey, 'Content-Type': 'application/json' },
              body: JSON.stringify({ plan: next === 'upgrade_enterprise' ? 'enterprise' : 'pro' })
            }).then(function(r) { return r.json().then(function(j) { return { s: r.status, b: j }; }); })
              .then(function(res) {
                if (res.s === 200 && res.b.url) {
                  // C5: assert the redirect target is Stripe Checkout/Billing before redirecting.
                  if (!/^https:\/\/checkout\.stripe\.com\//.test(res.b.url) &&
                      !/^https:\/\/billing\.stripe\.com\//.test(res.b.url)) {
                    setStatus('error', 'Suspicious redirect blocked. Email signal@aeoess.com — this should never happen.');
                    return;
                  }
                  window.location.href = res.b.url;
                } else if (res.s === 401) {
                  // Stored key invalid — clear and let them sign in again.
                  try { localStorage.removeItem('aps_api_key'); } catch(e) {}
                  setStatus('error', 'Your sign-in expired. Enter your email below to continue to checkout.');
                } else if (res.s === 503) {
                  setStatusHTML('error', 'Billing is not configured yet. Email <a href="mailto:signal@aeoess.com" style="color:inherit;text-decoration:underline;">signal@aeoess.com</a> to upgrade.');
                } else if (res.s === 400 && res.b && res.b.error && /already on/i.test(res.b.error)) {
                  setStatus('info', 'You are already on the ' + planLabel + ' plan. Heading to dashboard…');
                  setTimeout(function() { window.location.href = '/dashboard.html'; }, 1500);
                } else {
                  setStatusHTML('error', 'Could not start checkout: ' + esc((res.b && res.b.error) || 'unknown') + '. Email <a href="mailto:signal@aeoess.com" style="color:inherit;text-decoration:underline;">signal@aeoess.com</a> if this persists.');
                }
              }).catch(function() {
                setStatus('error', 'Network error reaching billing. Please retry.');
              });
          } else if (!existingKey) {
            setStatus('info', 'Create your account or sign in below to continue to ' + planLabel + ' checkout. Your card is not charged until Stripe asks.');
          }
        }
      } catch(e) {}
    }

    function handleEmailClick() {
      var input = document.querySelector('input[type="email"]');
      var pw = document.getElementById('aps-password');
      if (!input) return;
      var email = (input.value || '').trim();
      var password = pw ? (pw.value || '') : '';
      if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        setStatus('error', 'Enter a valid work email to continue.');
        input.focus();
        return;
      }
      if (!password) {
        setStatus('error', authMode === 'signup' ? 'Choose a password (at least 10 characters).' : 'Enter your password.');
        if (pw) pw.focus();
        return;
      }
      if (authMode === 'signup' && password.length < 10) {
        setStatus('error', 'Password must be at least 10 characters.');
        pw.focus();
        return;
      }

      var fn = authMode === 'signup' ? signupWithPassword : loginEmail;
      fn(email, password).then(function(res) {
        if ((res.status === 201 || res.status === 200) && res.body.api_key) {
          persistAndRedirect(res.body,
            authMode === 'signup'
              ? 'Account created. Redirecting to your dashboard…<br><span style="font-size:11.5px;opacity:.75;">Verify your email — link sent to ' + esc(email) + '.</span>'
              : 'Signed in. Redirecting to your dashboard…'
          );
        } else if (res.status === 409) {
          setStatusHTML('info', 'This email already has an account. <a id="aps-switch-to-signin" href="#" style="color:inherit;text-decoration:underline;">Sign in instead →</a>');
          var sw = document.getElementById('aps-switch-to-signin');
          if (sw) sw.addEventListener('click', function(e) { e.preventDefault(); document.getElementById('aps-mode-toggle').click(); });
        } else if (res.status === 401) {
          setStatus('error', 'Invalid email or password.');
        } else if (res.status === 403) {
          setStatus('error', (res.body && res.body.error) || 'Account is not active.');
        } else if (res.status === 429) {
          setStatus('error', 'Too many attempts from this network. Try again in a few minutes.');
        } else if (res.status === 400) {
          setStatus('error', (res.body && res.body.error) || 'Check your input and try again.');
        } else {
          setStatusHTML('error', 'Auth failed: ' + esc((res.body && res.body.error) || 'Unknown error') + '. Try again or email <a href="mailto:signal@aeoess.com" style="color:inherit;text-decoration:underline;">signal@aeoess.com</a>.');
        }
      }).catch(function(err) {
        setStatus('error', 'Could not reach the gateway. Check your connection and try again.');
        console.error('[aps-auth]', err);
      });
    }

    function handleForgotClick() {
      var input = document.querySelector('input[type="email"]');
      var email = (input && (input.value || '').trim()) || '';
      if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        setStatus('error', 'Enter your email above first, then click Forgot password.');
        if (input) input.focus();
        return;
      }
      setStatus('info', 'Sending reset link…');
      forgotPassword(email).then(function(res) {
        // Server always returns 200 regardless of whether email exists (no enumeration)
        setStatus('success', 'If that email is on file, a reset link is on its way. Check your inbox.');
      }).catch(function() {
        setStatus('error', 'Could not reach the gateway. Try again in a moment.');
      });
    }

    function maybeShowResetForm() {
      try {
        // Idempotent: if we already built the form, do not append another.
        // Called multiple times from the decorateAll() schedule to survive
        // React rehydration — without this check we get N reset forms.
        if (document.getElementById('aps-reset-form')) return;

        var params = new URLSearchParams(window.location.search);
        var token = params.get('reset_token');
        var verifyOk = params.get('verify_ok');
        var verifyErr = params.get('verify_error');
        if (verifyOk) {
          setStatus('success', 'Email verified. You can now sign in.');
          try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
          return;
        }
        if (verifyErr) {
          setStatus('error', esc(verifyErr));
          try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
          return;
        }
        if (!token) return;
        // Replace the email/password form with a reset form
        var col = getAuthColumn();
        if (!col) return;
        var emailInput = col.querySelector('input[type="email"]');
        var pw = document.getElementById('aps-password');
        var pwLabel = pw ? pw.previousElementSibling : null;
        var emailBtn = Array.from(col.querySelectorAll('button')).find(function(b) {
          return /Continue with email|Create account/.test((b.textContent || '').trim());
        });
        var ghBtn = Array.from(col.querySelectorAll('button')).find(function(b) {
          return /Continue with GitHub/.test((b.textContent || '').trim());
        });
        var modeRow = document.getElementById('aps-mode-row');
        // OR divider — find it by looking for a div with a span that says "or"
        var orDivider = null;
        col.querySelectorAll('div').forEach(function(d) {
          var span = d.querySelector('span');
          if (span && /^or$/i.test((span.textContent || '').trim())) orDivider = d;
        });
        // Hide existing email/password form + OR + GitHub button so the
        // reset form stands alone.
        var emailLabel = emailInput && emailInput.previousElementSibling;
        [emailLabel, emailInput, pwLabel, pw, emailBtn, modeRow, orDivider, ghBtn].forEach(function(el) { if (el) el.style.display = 'none'; });
        // Build reset form
        var form = document.createElement('div');
        form.id = 'aps-reset-form';
        form.innerHTML =
          '<label style="display:block;font-size:12px;color:rgb(138,138,142);margin-bottom:6px;font-weight:500;">New password</label>' +
          '<input id="aps-reset-pw" type="password" autocomplete="new-password" placeholder="At least 10 characters" style="width:100%;padding:10px 14px;font-size:14px;color:rgb(236,236,236);border:1px solid rgb(58,58,62);border-radius:4px;background:rgb(36,36,38);font-family:inherit;box-sizing:border-box;">' +
          '<button id="aps-reset-submit" style="width:100%;margin-top:14px;padding:11px 16px;background:rgb(236,236,236);color:rgb(36,36,38);border:none;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;">Set new password</button>' +
          '<p style="font-size:11.5px;color:rgb(138,138,142);margin-top:14px;">For your safety, all existing API keys will be revoked after the reset. Sign in again to issue a fresh key.</p>';
        // Insert after the heading paragraph (find first <p> inside the col)
        var firstP = col.querySelector('p');
        (firstP || col).insertAdjacentElement('afterend', form);
        document.getElementById('aps-reset-submit').addEventListener('click', function() {
          var newPw = document.getElementById('aps-reset-pw').value || '';
          if (newPw.length < 10) {
            setStatus('error', 'Password must be at least 10 characters.');
            return;
          }
          setStatus('info', 'Updating your password…');
          resetPassword(token, newPw).then(function(res) {
            if (res.status === 200) {
              setStatus('success', 'Password updated. Sign in to issue a fresh API key.');
              // Restore the sign-in form, clear the token from the URL
              try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
              setTimeout(function() { window.location.reload(); }, 1500);
            } else if (res.status === 400) {
              setStatus('error', (res.body && res.body.error) || 'Reset link is invalid or expired. Request a new one.');
            } else if (res.status === 429) {
              setStatus('error', 'Too many reset attempts, try again later.');
            } else {
              setStatus('error', 'Could not update password. Try again or email signal@aeoess.com.');
            }
          });
        });
        document.getElementById('aps-reset-pw').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); document.getElementById('aps-reset-submit').click(); }
        });
      } catch(e) { console.error('[aps-auth] reset form', e); }
    }

    function signupEmail(email) {
      // Legacy entry point (kept for backwards compat with anything that
      // called it). New flows use the password-aware functions above.
      return signupWithPassword(email, '');
    }

    // Event delegation — survives React rehydration
    document.addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var text = (btn.textContent || '').trim();
      if (/^Continue with email/.test(text)) {
        e.preventDefault();
        handleEmailClick();
      } else if (/^Continue with GitHub/.test(text)) {
        e.preventDefault();
        window.location.href = GATEWAY + '/auth/github/start';
      }
    }, true);

    // Enter-key submits
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      var t = e.target;
      if (t && t.tagName === 'INPUT' && t.type === 'email') {
        e.preventDefault();
        handleEmailClick();
      }
    });

    // No-op kept for compatibility with the existing decorateAll() chain.
    // Google + SSO buttons were removed; this function used to add their
    // "Coming soon" badges, no longer needed.
    function decorateButtons() {
      return;
    }
    function decorateAll() {
      decorateButtons();
      injectPasswordField();
      injectModeToggle();
      maybeShowResetForm();
      maybeShowUpgradeBanner();
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', decorateAll);
    } else {
      decorateAll();
    }
    // Re-decorate after any late hydration (React rehydrates the static markup)
    setTimeout(decorateAll, 200);
    setTimeout(decorateAll, 1000);

    // Display any ?auth_error= passed back from OAuth callback redirect
    function showQueryError() {
      try {
        var params = new URLSearchParams(window.location.search);
        var err = params.get('auth_error');
        if (err) {
          setStatusHTML('error', esc(err) + '. Try email signup or contact <a href="mailto:signal@aeoess.com" style="color:inherit;text-decoration:underline;">signal@aeoess.com</a>.');
          // Clean URL so reload doesn't re-display
          try { history.replaceState({}, '', window.location.pathname); } catch(e) {}
        }
      } catch(e) {}
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]); }); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', showQueryError);
    } else {
      showQueryError();
    }
  })();
  </script>
