  description: "Scale the Neuronpedia experiment from N=10 per group to N≥200 per group. Mechanical work, most code exists. Paired with controlled-probing feature-label validation (targeted prompts to activate/suppress the described concept), exact prompt set published in experiment/prompts-v1.1/, hosted-to-local verification transfer characterization (local sae_lens vs Neuronpedia hosted, within paper's epsilon), and cross-hardware reproducibility (H100 vs A100 or MI300X). This is the condition for submitting to FAccT/NeurIPS as a peer-reviewed venue rather than leaving the paper at preprint stage."
